<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zupnik</title>
<meta name="theme-color" content="#6a0f1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zupnik">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#6a0f1b;
  --cream:#fbe9cc;
  --brown:#5a2d12;
  --font:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 36%,rgba(255,90,70,.24),transparent 60%),
    radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.55),transparent 55%),
    repeating-radial-gradient(circle at 25% 20%,rgba(255,255,255,.035) 0 2px,transparent 2px 24px),
    repeating-radial-gradient(circle at 80% 70%,rgba(0,0,0,.09) 0 2px,transparent 2px 26px);
  font-family:var(--font);color:#fff;overflow:hidden;position:fixed;inset:0;
}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:0 10px}
#app.shake{animation:scr .45s}
#top{display:flex;align-items:center;justify-content:space-between;height:66px;flex:none;padding:6px 4px 0}
.hud{display:flex;flex-direction:column;align-items:center;font-size:17px;line-height:1;min-width:46px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hud svg{display:block}
.hud.bump{animation:bump .35s ease-out}
#lvl{
  font-size:26px;padding:3px 20px 5px;border-radius:16px;border:3px solid #7d1018;position:relative;overflow:hidden;white-space:nowrap;
  background:linear-gradient(#f2564b,#c4222a);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.4);letter-spacing:.3px;text-align:center;line-height:1
}
#lvl.hard{background:linear-gradient(#a061ff,#5a23b8);border-color:#2f0f6b}
#lvl small{display:block;font-size:13px;letter-spacing:1px;opacity:.95}
#lvl::after{content:"";position:absolute;top:0;bottom:0;width:30px;left:-40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
.tb{background:none;border:0;padding:0;color:#fff;font-family:var(--font);position:relative;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
.tb svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));transition:transform .4s}
.tb:active svg{transform:scale(.9) rotate(20deg)}
#spd small{position:absolute;right:-2px;bottom:-2px;font-size:20px;color:#fff;text-shadow:0 2px 0 #7d1018,0 0 4px #7d1018}
#stage{flex:none;display:flex;justify-content:center;position:relative}
#cv{width:min(100%,44dvh);aspect-ratio:1;display:block;touch-action:none}
#prog{
  flex:none;align-self:center;position:relative;width:min(78%,330px);height:30px;margin:2px 0 6px;
  border-radius:15px;background:#46250f;border:3px solid #dcab78;overflow:hidden;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 3px 6px rgba(0,0,0,.45)
}
#prog.warn{animation:warn .7s ease-in-out infinite}
#pfill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#c58245,#8f5528);transition:width .3s cubic-bezier(.3,1.3,.5,1),background .3s;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
#ptxt{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#stacks{flex:1;min-height:0;display:flex;gap:16px;justify-content:center;padding:0 22px;touch-action:none}
.col{
  --s:46px;
  flex:1;max-width:124px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:10px 0 0;border-radius:8px 8px 0 0;cursor:pointer;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),
    linear-gradient(90deg,#46230f,#6d3c1e 14%,#6d3c1e 86%,#46230f);
  border:3px solid #b07a46;border-bottom:0;box-shadow:inset 0 6px 12px rgba(0,0,0,.35);
  -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent);
  transition:filter .15s;touch-action:none
}
.col.press{filter:brightness(1.2)}
.col.shake{animation:shake .25s}
.it{
  --c:#fff;
  width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--s)*.6);margin-top:-5px;position:relative;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 72%,#000));
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.1);border:2px solid rgba(255,255,255,.9);
  font-family:var(--emoji);pointer-events:none;line-height:1
}
.it.hid{--c:#7b6586}
.it:first-child,.lid:first-child{margin-top:0}
.it.top{transform:scale(1.14);margin-bottom:5px;animation:idle 2.4s ease-in-out infinite}
.it.top.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1),idle 2.4s ease-in-out .34s infinite}
.it.blocked{filter:saturate(.6) brightness(.92)}
.it.unl{animation:unl .55s ease-out}
.it.rev{animation:rev .5s ease-out}
.it.thaw{animation:unl .55s ease-out}
.it.hint{box-shadow:0 0 0 3px #ffd23f,0 0 16px 5px rgba(255,210,63,.85)}
.it.fly{position:fixed;left:0;top:0;margin:0;z-index:7;animation:none}
.it .cd{position:absolute;right:-7px;top:-9px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.lk{position:absolute;right:-10px;bottom:-9px;background:#3a3a48;border:2px solid #fff;border-radius:10px;padding:0 6px;font:13px/17px var(--font);color:#fff;white-space:nowrap}
.ice{position:absolute;inset:-3px;border-radius:12px;background:linear-gradient(135deg,rgba(220,245,255,.85),rgba(120,190,240,.55));border:2px solid #e8fbff;box-shadow:inset 0 0 8px #fff;display:grid;place-items:center}
.ice b{font:16px/1 var(--font);color:#1d5f91;text-shadow:0 1px 0 #fff;position:absolute;bottom:2px;right:5px}
.ice i{font-style:normal;font-size:calc(var(--s)*.38);opacity:.9}
.lid{
  width:calc(var(--s) + 20px);flex:none;margin-top:-4px;border-radius:12px;position:relative;pointer-events:none;
  background:linear-gradient(90deg,#9aa1ab,#f6f8fa 30%,#ffffff 45%,#c3c9d1 75%,#8d949e);box-shadow:0 3px 0 #5f666f,inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.15);border:2px solid #7d848d
}
.lid i{position:absolute;left:50%;top:50%;width:10px;height:min(60%,34px);border-radius:6px;transform:translate(-50%,-50%);background:linear-gradient(90deg,#6c737d,#eef0f2 45%,#6c737d);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lid.fly{position:fixed;margin:0;z-index:7}
#boost{flex:none;display:flex;gap:12px;padding:8px 4px 12px;touch-action:none}
.bb{
  flex:1;height:64px;border-radius:18px;border:0;position:relative;font-size:34px;cursor:pointer;touch-action:none;
  background:linear-gradient(#fdeed3,#efd1a0);box-shadow:0 4px 0 #b3854d,inset 0 2px 0 rgba(255,255,255,.75);
  font-family:var(--emoji);transition:transform .08s
}
.bb.g{background:linear-gradient(#d9dce2,#afb4be);box-shadow:0 4px 0 #6f7480,inset 0 2px 0 rgba(255,255,255,.65)}
.bb.down{transform:translateY(3px)}
.bb .ic{display:inline-block}
.bb.used .ic{animation:boo .5s ease-out}
.bd{
  position:absolute;right:-6px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:#2ea043;color:#fff;
  font:20px/1 var(--font);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)
}
.bd.n{background:#8a1624}
#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  background:rgba(40,8,12,.94);border:2px solid #dcab78;padding:8px 16px;border-radius:14px;font-size:18px;text-align:center;line-height:1.2;
  max-width:90%;transition:.2s;z-index:12
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:6}
#banner.show{display:grid}
#banner div{font-size:54px;text-shadow:0 4px 0 #7d1018,0 0 24px rgba(255,120,80,.8);animation:ban 1.7s ease-in-out forwards;text-align:center;line-height:1}
#banner div small{display:block;font-size:24px;color:#ffd23f;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(30,0,5,.74);display:none;place-items:center;z-index:9}
.modal.show{display:grid}
.modal.show .card{animation:cardin .45s cubic-bezier(.2,1.4,.4,1)}
.card{background:var(--cream);color:var(--brown);border-radius:24px;padding:22px 20px;width:min(88%,340px);text-align:center;box-shadow:0 8px 0 #b3854d;position:relative;max-height:92%;overflow:auto}
.card h2{margin:0 0 6px;font-size:30px;font-weight:400;line-height:1.05}
.card p{margin:0 0 12px;font-size:18px;line-height:1.25}
.btn{
  display:block;width:100%;margin-top:10px;padding:10px 12px 12px;border:0;border-radius:16px;font:22px/1 var(--font);color:#fff;cursor:pointer;
  background:linear-gradient(#f2564b,#c4222a);box-shadow:0 4px 0 #7d1018,inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.35)
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1018}
.btn.alt{background:linear-gradient(#bf9164,#8d6240);box-shadow:0 4px 0 #5a3a20,inset 0 2px 0 rgba(255,255,255,.3)}
.btn.grn{background:linear-gradient(#4cc35d,#24883a);box-shadow:0 4px 0 #145a24,inset 0 2px 0 rgba(255,255,255,.3)}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0;border:3px solid #c9a06f;border-radius:14px;background:#fff8ea;color:var(--brown);font:22px var(--font);text-align:center;padding:6px;-webkit-user-select:text;user-select:text}
.row .btn{margin:0;width:auto;padding:10px 16px 12px}
textarea.code{width:100%;height:84px;border:3px solid #c9a06f;border-radius:12px;background:#fff8ea;color:var(--brown);font:12px/1.3 monospace;padding:8px;margin-top:8px;-webkit-user-select:text;user-select:text;resize:none}
.logo{width:120px;height:120px;border-radius:30px;display:block;margin:0 auto 10px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 4px #fff;object-fit:cover}
.rays{position:relative;width:150px;height:150px;margin:-6px auto 4px;display:grid;place-items:center}
.rays::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,60,.55) 0 12deg,transparent 12deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 8s linear infinite}
.rays .logo{position:relative;margin:0;animation:bob 2s ease-in-out infinite}
.stars{display:flex;justify-content:center;gap:6px;margin:2px 0 8px;font-size:44px;line-height:1}
.stars span{color:#d8c4a2;text-shadow:0 3px 0 #b3854d;transform:scale(0)}
.stars span.on{color:#ffc928;text-shadow:0 3px 0 #c97a00,0 0 14px rgba(255,200,40,.8)}
.stars span.go{animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:inherit;background-color:var(--bg);text-align:center;padding:20px}
#start.hide{animation:fadeout .4s forwards}
#start .big{width:min(62vw,250px);height:min(62vw,250px);border-radius:56px;object-fit:cover;box-shadow:0 10px 0 rgba(0,0,0,.3),0 0 0 6px #fff,0 0 60px rgba(255,150,80,.55);animation:bob 2.6s ease-in-out infinite}
#start h1{margin:14px 0 0;font-weight:400;font-size:64px;line-height:1;text-shadow:0 5px 0 #7d1018,0 0 30px rgba(255,140,90,.6);letter-spacing:1px}
#start h1 span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
#start p{margin:0;font-size:20px;opacity:.9}
#start .btn{width:min(70vw,280px);font-size:28px;padding:14px 12px 16px;animation:pulse 1.6s ease-in-out infinite}
#start .steam{position:absolute;width:24px;height:60px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.5),transparent 70%);filter:blur(4px);animation:steam 3s ease-in infinite;opacity:0}
@keyframes idle{0%,100%{transform:scale(1.14) translateY(0)}50%{transform:scale(1.18) translateY(-2px)}}
@keyframes pop{0%{transform:scale(.5) translateY(14px)}100%{transform:scale(1.14)}}
@keyframes unl{0%{transform:scale(1)}30%{transform:scale(1.32) rotate(-12deg)}60%{transform:scale(.95) rotate(8deg)}100%{transform:scale(1)}}
@keyframes rev{0%{transform:rotateY(90deg) scale(1.1)}100%{transform:rotateY(0) scale(1.14)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes scr{15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,2px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes shine{0%,70%{left:-40px}100%{left:140%}}
@keyframes cardin{0%{transform:scale(.5) rotate(-6deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes warn{50%{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px 4px rgba(255,60,50,.85)}}
@keyframes ban{0%{transform:scale(.2);opacity:0}18%{transform:scale(1.15);opacity:1}28%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes boo{30%{transform:scale(1.4) rotate(-15deg)}60%{transform:scale(.9) rotate(10deg)}}
@keyframes fadeout{to{opacity:0;transform:scale(1.15);visibility:hidden}}
@keyframes wave{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-90px) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.it.top,.it.top.pop,#lvl::after,.rays::before,#start .big,#start h1 span{animation:none}}
@media (max-height:640px){.col{--s:40px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="hud" id="starhud">
      <svg width="46" height="44" viewBox="0 0 24 24"><defs><linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop id="s1" offset="0" stop-color="#ffcf3a"/><stop id="s2" offset="0" stop-color="#3a2a14"/></linearGradient></defs><path d="M12 1.8l2.9 6.2 6.7.8-4.9 4.6 1.3 6.7L12 16.7 6 20.1l1.3-6.7L2.4 8.8l6.7-.8z" fill="url(#sg)" stroke="#2a1608" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="pct">0%</span>
    </div>
    <div class="hud" id="candyhud"><span id="candyico"></span><span id="candy">0</span></div>
    <div id="lvl">Poziom 1</div>
    <button class="tb" id="spd" aria-label="Prędkość taśmy">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M3 4l9 8-9 8zM12 4l9 8-9 8z" fill="#ffb81f" stroke="#c97a00" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <small id="spdt">x1</small>
    </button>
    <button class="tb" id="gear" aria-label="Menu">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 8.4a3.6 3.6 0 100 7.2 3.6 3.6 0 000-7.2zm9 4.6v-2l-2.2-.6a7 7 0 00-.7-1.7l1.2-2-1.4-1.4-2 1.2a7 7 0 00-1.7-.7L13.6 3h-2l-.6 2.2a7 7 0 00-1.7.7l-2-1.2L5.9 6.1l1.2 2a7 7 0 00-.7 1.7L4.2 11v2l2.2.6c.2.6.4 1.2.7 1.7l-1.2 2 1.4 1.4 2-1.2c.5.3 1.1.5 1.7.7l.6 2.2h2l.6-2.2c.6-.2 1.2-.4 1.7-.7l2 1.2 1.4-1.4-1.2-2c.3-.5.5-1.1.7-1.7z" fill="#ffb81f" stroke="#c97a00" stroke-width="1" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="prog"><div id="pfill"></div><div id="ptxt">Taśma 0/0</div></div>
  <div id="stacks"></div>
  <div id="boost"></div>
</div>
<div id="toast"></div>
<div id="banner"></div>

<script id="core">
/* ===== ZUPNIK CORE: czysta logika gry, bez DOM ===== */
var Z=(function(){
'use strict';
var X0=28,Y0=28,X1=332,Y1=332,R=52;
var Ls=Y1-Y0-2*R,Lh=X1-X0-2*R,ARC=R*Math.PI/2;
var segs=[
  {len:Ls,f:function(u){return{x:X0,y:Y1-R-u,a:-Math.PI/2}}},
  {len:ARC,f:function(u){var t=Math.PI+u/R;return{x:X0+R+R*Math.cos(t),y:Y0+R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Lh,f:function(u){return{x:X0+R+u,y:Y0,a:0}}},
  {len:ARC,f:function(u){var t=1.5*Math.PI+u/R;return{x:X1-R+R*Math.cos(t),y:Y0+R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Ls,f:function(u){return{x:X1,y:Y0+R+u,a:Math.PI/2}}},
  {len:ARC,f:function(u){var t=u/R;return{x:X1-R+R*Math.cos(t),y:Y1-R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Lh,f:function(u){return{x:X1-R-u,y:Y1,a:Math.PI}}},
  {len:ARC,f:function(u){var t=Math.PI/2+u/R;return{x:X0+R+R*Math.cos(t),y:Y1-R+R*Math.sin(t),a:t+Math.PI/2}}}
];
var P=0;segs.forEach(function(g){P+=g.len});
function pos(d){d=((d%P)+P)%P;for(var i=0;i<segs.length;i++){var g=segs[i];if(d<=g.len)return g.f(d);d-=g.len}return segs[0].f(0)}
var PICKS=[Ls+ARC+Lh/2, Ls+ARC+Lh+ARC+Ls/2, Ls+ARC+Lh+ARC+Ls+ARC+Lh/2];
var BASE=168,GAP=40,FLY=0.34;

function rand(G){var a=G.rs|0;a=a+0x6D2B79F5|0;G.rs=a>>>0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function ri(G,n){return Math.floor(rand(G)*n)}
function shuf(G,a){for(var i=a.length-1;i>0;i--){var j=ri(G,i+1);var x=a[i];a[i]=a[j];a[j]=x}return a}

var OVR=null;
/* krzywa trudności */
function params(L){
  var hard=L>=10&&L%10===0;
  var p={hard:hard};
  p.types=Math.min(7,3+Math.floor(L/5));
  p.total=Math.min(56,Math.round(18+Math.min(L,50)*0.7+Math.max(0,L-50)*0.05));
  p.cap=L<=4?11:Math.max(9,10-Math.floor(L/60));
  p.clump=Math.max(0.3,0.62-L*0.003);
  p.locks=L>=5?Math.min(4,1+Math.floor((L-5)/18)):0;
  p.lockN=3+Math.min(3,Math.floor(L/50));
  p.lids=L>=7?Math.min(3,1+Math.floor((L-7)/25)):0;
  p.lidMax=2+Math.min(1,Math.floor(L/60));
  p.hidden=L>=9?Math.min(0.25,0.08+(L-9)*0.002):0;
  p.potLock=L>=12?Math.min(0.35,0.15+(L-12)*0.002):0;
  p.ice=L>=20?Math.min(3,1+Math.floor((L-20)/30)):0;
  p.iceN=2+Math.min(2,Math.floor(L/80));
  p.ordMin=Math.min(4,2+Math.floor(L/6));
  p.ordMax=Math.min(7,4+Math.floor(L/8));
  p.prefer=L<=3?0.9:Math.max(0.1,0.5-L*0.02);
  p.extra=1+Math.min(1,Math.floor(L/60));
  

  p.beltW=L<=3?1.5:0;
  if(OVR)OVR(p,L);
  if(hard){p.cap=Math.max(6,p.cap-1);p.locks=Math.ceil(p.locks*1.4);p.lids=Math.ceil(p.lids*1.4);p.ice=Math.ceil(p.ice*1.4);p.clump*=0.7;p.prefer*=0.85;p.extra+=1}
  return p;
}

function build(L,att){
  var G={v:3,level:L,rs:((Math.imul(L,2654435761)^0x5bd1e995)+Math.imul(att,40503))>>>0,time:0,off:0,uid:0,oid:0,ev:[],
    belt:[],inbox:[],active:[null,null],delivered:0,removed:0,state:'play',slowUntil:0,boosts:0,revives:0};
  for(var w=0;w<7;w++)rand(G);
  var p=params(L);G.p=p;G.cap=p.cap;
  var pool=shuf(G,[0,1,2,3,4,5,6,7,8]).slice(0,p.types);
  var N=p.total;G.start=N;
  G.stacks=[[],[],[]];
  for(var c=0;c<3;c++){
    var len=Math.floor(N/3)+(c<N%3?1:0),prev=-1;
    for(var k=0;k<len;k++){
      var t=(prev>=0&&rand(G)<p.clump)?prev:pool[ri(G,pool.length)];
      prev=t;
      G.stacks[c].push({id:++G.uid,t:t,lock:0,ice:0,lid:0,hid:false,candy:rand(G)<0.1});
    }
  }
  var flat=[].concat(G.stacks[0],G.stacks[1],G.stacks[2]);
  var order=shuf(G,flat.slice()),oi=0,i;
  for(i=0;i<p.locks&&oi<order.length;i++,oi++)order[oi].lock=2+ri(G,p.lockN);
  for(i=0;i<p.ice&&oi<order.length;i++,oi++)order[oi].ice=1+ri(G,p.iceN);
  for(var g=0;g<p.lids;g++){
    var col=ri(G,3),s=G.stacks[col],size=2+ri(G,p.lidMax-1);
    if(s.length<size+2)continue;
    var st=1+ri(G,s.length-size-1),ok=true;
    for(k=st;k<st+size;k++)if(s[k].lid)ok=false;
    if(!ok)continue;
    for(k=st;k<st+size;k++)s[k].lid=g+1;
  }
  flat.forEach(function(it){if(rand(G)<p.hidden)it.hid=true});
  normalize(G);fill(G);G.ev=[];
  return G;
}


/* bot sprawdzający, czy poziom da się przejść */
function botPlay(G,seed,revives,limit){
  var r={rs:seed>>>0},dt=0.05,t=0,next=0,idle=0;
  while(t<(limit||500)){
    if(t>=next){
      next=t+0.15+rand(r)*0.2;
      var ld=load(G);
      if(ld<G.cap){
        var need={},ms=matchTypes(G),i,c;
        G.active.forEach(function(o){if(o&&!o.locked&&o.left>0)need[o.t]=(need[o.t]||0)+o.left});
        G.belt.concat(G.inbox).forEach(function(b){if(need[b.t])need[b.t]--});
        var ok=[0,1,2].filter(function(i){var x=G.stacks[i][0];return x&&!x.lock&&!x.ice});
        c=ok.filter(function(i){return need[G.stacks[i][0].t]>0})[0];
        if(c===undefined&&ok.length){
          var best=-1,bd=99;
          ok.forEach(function(i){var s=G.stacks[i];for(var k=0;k<s.length;k++){var it=s[k];if(it.lid||(it.hid&&k>0))break;if(need[it.t]>0){if(k<bd){bd=k;best=i}break}}});
          var bm=G.belt.some(function(b){return ms[b.t]});
          var onb={};G.belt.concat(G.inbox).forEach(function(b){onb[b.t]=(onb[b.t]||0)+1});
          var same=ok.filter(function(i){return onb[G.stacks[i][0].t]});
          same.sort(function(a,b){return onb[G.stacks[b][0].t]-onb[G.stacks[a][0].t]});
          if(best>=0&&ld+bd<G.cap-1)c=best;
          else if(same.length&&ld<G.cap-2)c=same[0];
          else if(best>=0&&ld+bd<G.cap)c=best;
          else if(ld<G.cap-4)c=ok[Math.floor(rand(r)*ok.length)];
          else if(!bm){idle+=0.25;if(idle>8)c=ok[Math.floor(rand(r)*ok.length)]}
        }
        if(c!==undefined){launch(G,c);idle=0}
      }
    }
    step(G,dt,1);G.ev=[];t+=dt;
    if(G.state==='win')return true;
    if(G.state==='lose'){if(revives>0){revives--;revive(G);G.ev=[];continue}return false}
  }
  return false;
}
function create(L){
  for(var a=0;a<20;a++){
    var test=build(L,a);
    if(botPlay(test,a*7919+L,L<=30?1:2)){var G=build(L,a);G.att=a;return G}
  }
  var G2=build(L,0);G2.att=-1;return G2;
}

function counts(G){
  var c=[0,0,0,0,0,0,0,0,0],b=c.slice(),top=c.slice(),vis=c.slice();
  G.belt.forEach(function(x){c[x.t]++;b[x.t]++});
  G.inbox.forEach(function(x){c[x.t]++;b[x.t]++});
  G.stacks.forEach(function(s){
    s.forEach(function(it,k){c[it.t]++;if(k<6&&!it.lid&&!(it.hid&&k>0))vis[it.t]++});
    if(s[0])top[s[0].t]+=(s[0].lock||s[0].ice)?0.3:1;
    if(s[1]&&!s[1].lid&&!s[1].hid)top[s[1].t]+=0.35;
  });
  return{c:c,b:b,top:top,vis:vis};
}
function newOrder(G,slot){
  var k=counts(G),c=k.c,b=k.b,top=k.top,vis=k.vis;
  var other=G.active[1-slot];
  var free=c.slice();if(other)free[other.t]-=other.left;
  var cand=[],t,i;
  for(t=0;t<9;t++)if(free[t]>0)cand.push(t);
  if(!cand.length)return null;
  if(other&&cand.length>1)cand=cand.filter(function(x){return x!==other.t});
  var seen=cand.filter(function(x){return b[x]>0||vis[x]>0});
  if(seen.length)cand=seen;
  var bc=cand.filter(function(x){return b[x]>0});
  if(bc.length&&rand(G)<G.p.prefer){
    t=bc[0];for(i=0;i<bc.length;i++){var x=bc[i];if(b[x]>b[t]||(b[x]===b[t]&&rand(G)<0.5))t=x}
  }else{
    var tot=0,wts=cand.map(function(x){var v=top[x]*2+vis[x]*0.4+b[x]*G.p.beltW+free[x]*0.1+0.05;tot+=v;return v});
    var q=rand(G)*tot;t=cand[cand.length-1];
    for(i=0;i<cand.length;i++){q-=wts[i];if(q<=0){t=cand[i];break}}
  }
  var mx=Math.min(free[t],G.p.ordMax);
  var lo=Math.min(G.p.ordMin,mx),n=lo+ri(G,mx-lo+1);
  var o={id:++G.oid,t:t,n:n,left:n,locked:false};
  if(slot===1&&G.p.potLock>0&&G.active[0]&&rand(G)<G.p.potLock)o.locked=true;
  G.ev.push({k:'orderNew',slot:slot,o:o});
  return o;
}
function fill(G){
  for(var s=0;s<2;s++)if(!G.active[s])G.active[s]=newOrder(G,s);
  var a=G.active;
  if(a[1]&&a[1].locked&&!a[0]){a[1].locked=false;G.ev.push({k:'potUnlock'})}
}
function validate(G){
  var c=counts(G).c;
  for(var s=0;s<2;s++){
    var o=G.active[s];if(!o)continue;
    var av=c[o.t];if(s===1&&G.active[0]&&G.active[0].t===o.t)av-=G.active[0].left;
    if(o.left>av){o.left=Math.max(0,av);if(o.left===0){G.active[s]=null;G.ev.push({k:'orderGone',slot:s,o:o})}}
  }
  fill(G);
}
function normalize(G){
  for(var c=0;c<3;c++){
    var s=G.stacks[c],top=s[0];if(!top)continue;
    if(top.lid){var id=top.lid,ids=[];s.forEach(function(it){if(it.lid===id){it.lid=0;ids.push(it.id)}});G.ev.push({k:'lidOpen',col:c,lid:id,ids:ids})}
    if(top.hid){top.hid=false;G.ev.push({k:'reveal',id:top.id})}
  }
  var tops=G.stacks.map(function(s){return s[0]}).filter(Boolean);
  var v=function(t){return t.lock>0?t.lock:t.ice};
  if(tops.length&&tops.every(function(t){return t.lock>0||t.ice>0})){
    var m=tops[0];tops.forEach(function(t){if(v(t)<v(m))m=t});
    m.lock=0;m.ice=0;G.ev.push({k:'unlock',id:m.id,auto:true});
  }
}
function matchTypes(G){var s={};G.active.forEach(function(o){if(o&&!o.locked&&o.left>0)s[o.t]=1});return s}
function load(G){return G.belt.length+G.inbox.length}
function launch(G,i){
  if(G.state!=='play')return{ok:false,why:'state'};
  var s=G.stacks[i],top=s&&s[0];
  if(!top)return{ok:false,why:'empty'};
  if(top.lock>0)return{ok:false,why:'lock',n:top.lock};
  if(top.ice>0)return{ok:false,why:'ice',n:top.ice};
  if(load(G)>=G.cap)return{ok:false,why:'full'};
  s.shift();G.removed++;
  G.inbox.push({t:top.t,at:G.time+FLY});
  G.stacks.forEach(function(st){st.forEach(function(it){if(it.lock>0){it.lock--;if(it.lock===0)G.ev.push({k:'unlock',id:it.id})}})});
  normalize(G);
  return{ok:true,item:top};
}
function pick(G,b){
  var a=G.active,s=-1;
  for(var k=0;k<2;k++)if(a[k]&&!a[k].locked&&a[k].left>0&&a[k].t===b.t){s=k;break}
  if(s<0)return false;
  var o=a[s];o.left--;G.delivered++;
  var p=pos(b.d);
  G.ev.push({k:'pick',slot:s,t:b.t,x:p.x,y:p.y});
  G.stacks.forEach(function(st){st.forEach(function(it){if(it.ice>0){it.ice--;if(it.ice===0)G.ev.push({k:'thaw',id:it.id})}})});
  if(o.left===0){
    G.ev.push({k:'orderDone',slot:s,o:o});
    a[s]=null;
    if(s===0&&a[1]&&a[1].locked){a[1].locked=false;G.ev.push({k:'potUnlock'})}
    fill(G);
  }
  normalize(G);
  validate(G);
  return true;
}
function clear(G){for(var i=0;i<G.belt.length;i++){var d=G.belt[i].d;if(Math.min(d,P-d)<GAP)return false}return true}
function step(G,dt,mul){
  if(G.state!=='play'&&G.state!=='win')return;
  G.time+=dt;
  var sp=BASE*mul*(G.time<G.slowUntil?0.35:1)*dt;
  G.off+=sp;if(G.off>1e6)G.off-=1e6;
  if(G.inbox.length&&G.inbox[0].at<=G.time&&clear(G))G.belt.push({t:G.inbox.shift().t,d:0,born:G.time});
  for(var i=G.belt.length-1;i>=0;i--){
    var b=G.belt[i],prev=b.d;b.d+=sp;
    if(b.d>=P){b.d-=P;continue}
    if(G.state!=='play')continue;
    for(var j=0;j<PICKS.length;j++){var pk=PICKS[j];if(prev<pk&&b.d>=pk){G.belt.splice(i,1);if(!pick(G,b))G.belt.splice(i,0,b);break}}
  }
  if(G.state==='play'&&!G.inbox.length){
    if(!G.belt.length&&G.stacks.every(function(s){return !s.length})){G.state='win';G.ev.push({k:'win'})}
    else if(G.belt.length>=G.cap){
      var ms=matchTypes(G);
      if(!G.belt.some(function(b){return ms[b.t]})){G.state='lose';G.ev.push({k:'lose'})}
    }
  }
}
function sweep(G,strict){
  var keep={};G.active.forEach(function(o){if(o&&o.left>0&&(!strict||!o.locked))keep[o.t]=1});
  var n=G.belt.length;G.belt=G.belt.filter(function(b){return keep[b.t]});
  var r=n-G.belt.length;G.gone=(G.gone||0)+r;if(r)validate(G);return r;
}
function shuffle(G){
  var all=[].concat(G.stacks[0],G.stacks[1],G.stacks[2]);
  var ms=matchTypes(G),lk={};G.active.forEach(function(o){if(o&&o.locked)lk[o.t]=1});
  all.forEach(function(it){it.lid=0});
  var keyed=all.map(function(it){return{it:it,k:(ms[it.t]?0:lk[it.t]?1:2)+rand(G)*0.9}});
  keyed.sort(function(a,b){return a.k-b.k});
  G.stacks=[[],[],[]];keyed.forEach(function(x,i){G.stacks[i%3].push(x.it)});
  normalize(G);
}
function revive(G){G.state='play';G.revives++;sweep(G,true);fill(G)}
function slow(G){G.slowUntil=G.time+8}
return{setOverride:function(f){OVR=f},create:create,build:build,botPlay:botPlay,step:step,launch:launch,sweep:sweep,shuffle:shuffle,slow:slow,revive:revive,matchTypes:matchTypes,load:load,
  params:params,pos:pos,P:P,PICKS:PICKS,X0:X0,Y0:Y0,X1:X1,Y1:Y1,R:R,GAP:GAP,BASE:BASE,FLY:FLY};
})();
if(typeof module!=='undefined')module.exports=Z;
</script>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const FONT_EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT_TXT='"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
const PI2=Math.PI*2;
const TYPES=[
  {e:'🥩',c:'#f6c9c4'},{e:'🍄',c:'#efe3cf'},{e:'🥬',c:'#d6efc2'},{e:'🐟',c:'#cde6f6'},
  {e:'🍤',c:'#fbd9bd'},{e:'🥕',c:'#fde0b0'},{e:'🍆',c:'#e3d0ee'},{e:'🥑',c:'#dcebb5'},{e:'🥟',c:'#f6ecd0'}
];
const CANDY='<svg class="cd" width="18" height="22" viewBox="0 0 24 30"><g stroke-linejoin="round" stroke-width="1.6"><polygon points="12,2 15.1,10 8.9,10" fill="#fff" stroke="#fff"/><polygon points="8.9,10 15.1,10 17.2,19 6.8,19" fill="#ff9a1f" stroke="#ff9a1f"/><polygon points="6.8,19 17.2,19 21,28 3,28" fill="#ffd62e" stroke="#ffd62e"/></g></svg>';
$('#candyico').innerHTML=CANDY.replace('class="cd" width="18" height="22"','width="30" height="36"');
$('#title').innerHTML=[...'Zupnik'].map((ch,i)=>`<span style="animation-delay:${i*0.12}s">${ch}</span>`).join('');

/* ---------- zapis (ten sam klucz od pierwszej wersji, nic się nie kasuje) ---------- */
const KEY='zupnik-v1',BKEY='zupnik-backup';
const S0=()=>({level:1,maxLevel:1,candy:0,boosters:[3,3,3,3],mul:1,seen:{},stars:{},game:null});
let S=S0();
function loadSave(){
  for(const k of [KEY,BKEY,'hotpot-v2','hotpot-v1']){
    try{const j=JSON.parse(localStorage.getItem(k));if(j&&j.level)return j}catch(e){}
  }
  return null;
}
(function(){
  const j=loadSave();
  if(j){
    S.level=Math.max(1,parseInt(j.level,10)||1);
    S.maxLevel=Math.max(S.level,parseInt(j.maxLevel,10)||1);
    S.candy=Math.max(0,parseInt(j.candy,10)||0);
    if(Array.isArray(j.boosters)&&j.boosters.length===4)S.boosters=j.boosters.map(n=>Math.max(0,parseInt(n,10)||0));
    if([1,2,3].includes(j.mul))S.mul=j.mul;
    if(j.seen&&typeof j.seen==='object')S.seen=j.seen;
    if(j.stars&&typeof j.stars==='object')S.stars=j.stars;
    if(j.game&&j.game.v===3&&j.game.level===S.level&&j.game.state==='play')S.game=j.game;
  }
})();
let G=null;
function save(){
  try{
    S.game=(G&&G.state==='play')?G:null;
    const txt=JSON.stringify(S,(k,v)=>k==='ev'?undefined:v);
    localStorage.setItem(KEY,txt);
    localStorage.setItem(BKEY,JSON.stringify(Object.assign({},S,{game:null})));
  }catch(e){}
}

/* ---------- canvas ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.max(2,Math.round(r.width*dpr));cv.height=Math.max(2,Math.round(r.height*dpr))}
window.addEventListener('resize',resize);
/* emoji jako gotowe obrazki – na iPhonie emoji rysowane w canvasie z gradientem znikały */
const SPR={};
function spr(e){
  if(SPR[e])return SPR[e];
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');x.font='96px '+FONT_EMOJI;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.fillText(e,64,70);
  SPR[e]=c;return c;
}
function emo(e,x,y,size){ctx.drawImage(spr(e),x-size/2,y-size/2,size,size)}

/* ---------- pomocnicze ---------- */
const rr_=(a,b)=>a+Math.random()*(b-a);
let toastT;
function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms||1800)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bump(sel){const el=$(sel);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
const easeBack=t=>{const c=1.70158,d=t-1;return 1+(c+1)*d*d*d+c*d*d};
function plural(n,a,b,c){if(n===1)return a;const m=n%10,h=n%100;return(m>=2&&m<=4&&(h<12||h>14))?b:c}

/* ---------- efekty (tylko wygląd) ---------- */
const FX={parts:[],ripples:[],steam:[],flies:[],out:[],pot:[],badge:[{born:0,flash:0},{born:0,flash:0}],steamAcc:0,combo:0,lastPick:0,levelAt:0};
const BADGE=[{x:128,y:202},{x:234,y:158}];
function splash(x,y,cols_,n){
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+rr_(-1.3,1.3),v=rr_(50,130);
    FX.parts.push({k:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:300,life:.65,max:.65,s:rr_(2,4),c:cols_[Math.floor(Math.random()*cols_.length)],r:0,vr:0});
  }
  FX.ripples.push({x,y,t:0});
}
function confetti(x,y,n,spread){
  const cs=['#ffd23f','#ff5d5d','#4dd2ff','#ffffff','#ff9a1f','#b28dff','#6be36b'];
  for(let i=0;i<n;i++){
    const a=rr_(0,PI2),v=rr_(40,spread||150);
    FX.parts.push({k:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,g:230,life:rr_(.9,1.6),max:1.6,s:rr_(5,9),c:cs[Math.floor(Math.random()*cs.length)],r:rr_(0,PI2),vr:rr_(-9,9)});
  }
}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=rr_(0,PI2),v=rr_(30,90);FX.parts.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0,life:.7,max:.7,s:rr_(3,6),c:'#fff6c2',r:rr_(0,PI2),vr:rr_(-4,4)})}}
function floatText(x,y,s,c,size){FX.parts.push({k:'text',x,y,vx:0,vy:-38,g:0,life:1.1,max:1.1,s,c:c||'#ffe066',size:size||26,r:0,vr:0})}

/* ---------- obsługa zdarzeń z logiki ---------- */
const flags={};
function handleEvents(){
  if(!G||!G.ev.length)return false;
  const now=performance.now();let dirty=false;
  const evs=G.ev;G.ev=[];
  for(const e of evs){
    switch(e.k){
      case 'orderNew':FX.badge[e.slot]={born:now,flash:0};break;
      case 'orderDone':{
        const b=BADGE[e.slot];
        FX.out.push({o:Object.assign({},e.o),slot:e.slot,born:now,done:true});
        confetti(b.x,b.y,30,180);sparkle(b.x,b.y,12);floatText(b.x,b.y-30,'+1 🍬');
        FX.pot=FX.pot.filter(p=>p.slot!==e.slot);
        S.candy++;bump('#candyhud');break;}
      case 'orderGone':FX.out.push({o:Object.assign({},e.o),slot:e.slot,born:now,done:false});break;
      case 'pick':{
        const b=BADGE[e.slot];
        FX.flies.push({e:TYPES[e.t].e,x0:e.x,y0:e.y,x1:b.x,y1:b.y,t:0,slot:e.slot});
        FX.badge[e.slot].flash=now+350;
        FX.combo=(now-FX.lastPick<1300)?FX.combo+1:1;FX.lastPick=now;
        if(FX.combo>=3)setTimeout(()=>floatText(180,120,'Combo x'+FX.combo+'!','#7ff7ff',30),350);
        bump('#starhud');break;}
      case 'unlock':flags[e.id]='unl';dirty=true;break;
      case 'thaw':flags[e.id]='thaw';dirty=true;break;
      case 'reveal':flags[e.id]='rev';dirty=true;break;
      case 'lidOpen':{
        const el=document.querySelector('.lid[data-lid="'+e.lid+'"]');
        if(el){
          const r=el.getBoundingClientRect(),c=el.cloneNode(true);c.classList.add('fly');
          Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
          document.body.appendChild(c);
          const dir=e.col===2?-1:1;
          c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dir*20}px,-30px) rotate(${dir*-12}deg)`,opacity:1,offset:.3},{transform:`translate(${dir*90}px,-140px) rotate(${dir*40}deg) scale(.8)`,opacity:0}],{duration:650,easing:'ease-out'}).onfinish=()=>c.remove();
        }
        e.ids.forEach(id=>flags[id]='rev');dirty=true;break;}
      case 'potUnlock':confetti(BADGE[1].x,BADGE[1].y,16,120);floatText(BADGE[1].x,BADGE[1].y-30,'Otwarte!','#ffffff',22);FX.badge[1].flash=performance.now()+400;break;
      case 'win':onWin();break;
      case 'lose':onLose();break;
    }
  }
  return dirty;
}

/* ---------- start poziomu ---------- */
const INTROS=[
  [5,'lock','Zamek 🔒: składnik odblokuje się po kilku wrzutach z innych kolumn.'],
  [7,'lid2','Pokrywa zakrywa kilka składników. Otworzy się sama, gdy dojdzie na górę.'],
  [9,'hid','❓ Ukryte składniki odsłonią się na górze kolumny.'],
  [10,'hard','Co 10. poziom jest trudny: mniej miejsca na taśmie i więcej przeszkód.'],
  [12,'ord','Kłódka na garnku: druga połowa otworzy się po skompletowaniu pierwszego zamówienia.'],
  [20,'ice','Lód ❄️: rozmarza po kilku składnikach wrzuconych do zupy.']
];
let prevTop=[0,0,0];
function resetFx(){FX.parts=[];FX.ripples=[];FX.flies=[];FX.out=[];FX.pot=[];FX.combo=0;FX.levelAt=performance.now();FX.badge=[{born:performance.now()+300,flash:0},{born:performance.now()+450,flash:0}]}
function startLevel(level,snap){
  hideModals();
  G=snap||Z.create(level);G.ev=[];
  S.level=G.level;
  resetFx();prevTop=[0,0,0];
  renderStacks();updateHUD();save();
  showBanner();
  if(!snap)showIntros(level);
}
function showBanner(){
  const b=$('#banner');
  b.innerHTML='<div>Poziom '+G.level+(G.p.hard?'<small>Trudny poziom!</small>':'')+'</div>';
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  clearTimeout(showBanner.t);showBanner.t=setTimeout(()=>b.classList.remove('show'),1750);
}
function showIntros(level){
  const list=INTROS.filter(x=>level>=x[0]&&!S.seen[x[1]]);
  list.forEach(x=>S.seen[x[1]]=1);
  if(list.length)save();
  list.forEach((x,i)=>setTimeout(()=>toast(x[2],3600),1800+i*3800));
  if(level===1&&!S.seen.tut){S.seen.tut=1;save();setTimeout(()=>toast('Wrzucaj składniki na taśmę. Poziom kończy się, gdy wszystko trafi do zupy. Uważaj, żeby nie zapchać taśmy!',4200),1800)}
}

/* ---------- kolumny ---------- */
const stacksEl=$('#stacks');
for(let i=0;i<3;i++){const c=document.createElement('div');c.className='col';stacksEl.appendChild(c)}
const cols=[...stacksEl.children];
let hintUntil=0;
function renderStacks(){
  const ms=Z.matchTypes(G),hint=performance.now()<hintUntil;
  cols.forEach((el,i)=>{
    const st=G.stacks[i];
    const topId=st[0]?st[0].id:0;
    const pop=topId&&prevTop[i]!==topId;prevTop[i]=topId;
    let h='';
    for(let k=0;k<st.length&&k<10;k++){
      const it=st[k];
      if(it.lid){
        let n=0;const id=it.lid;while(k+n<st.length&&st[k+n].lid===id)n++;
        h+=`<div class="lid" data-lid="${id}" style="height:calc(var(--s) + ${n-1} * (var(--s) - 5px))"><i></i></div>`;
        k+=n-1;continue;
      }
      const hid=it.hid&&k>0;
      const f=flags[it.id];if(f)delete flags[it.id];
      let cls='it';
      if(k===0){cls+=' top';if(pop)cls+=' pop'}
      if(hid)cls+=' hid';
      if(it.lock>0||it.ice>0)cls+=' blocked';
      if(f)cls+=' '+f;
      if(hint&&!hid&&ms[it.t])cls+=' hint';
      let inner=hid?'❓':TYPES[it.t].e;
      if(it.candy&&!hid)inner+=CANDY;
      if(it.lock>0)inner+='<span class="lk">🔒'+it.lock+'</span>';
      if(it.ice>0)inner+='<span class="ice"><i>❄️</i><b>'+it.ice+'</b></span>';
      h+=`<div class="${cls}" style="--c:${hid?'#7b6586':TYPES[it.t].c}">${inner}</div>`;
    }
    el.innerHTML=h;
  });
}
function updateHUD(){
  const p=G.start?Math.min(1,(G.delivered+(G.gone||0))/G.start):0;
  $('#pct').textContent=Math.floor(p*100)+'%';
  $('#s1').setAttribute('offset',p);$('#s2').setAttribute('offset',p);
  $('#candy').textContent=S.candy;
  const L=$('#lvl');L.className=G.p.hard?'hard':'';
  L.innerHTML='Poziom '+G.level+(G.p.hard?'<small>TRUDNY</small>':'');
  $('#spdt').textContent='x'+S.mul;
  beltShown=-1;
  renderBoost();
}
let beltShown=-1;
function updateBelt(){
  if(!G)return;
  const n=Z.load(G);if(n===beltShown)return;beltShown=n;
  const f=Math.min(1,n/G.cap);
  const el=$('#pfill');el.style.width=(f*100)+'%';
  el.style.background=f>=.99?'linear-gradient(#ff6a5a,#c4222a)':f>=.7?'linear-gradient(#ffb04a,#d9761a)':'linear-gradient(#c58245,#8f5528)';
  $('#ptxt').textContent='Taśma '+n+'/'+G.cap;
  $('#prog').classList.toggle('warn',f>=.8);
}
const BICON=['📋','🧹','🔀','❄️'];
const BNAME=['Podpowiedź','Wyczyść taśmę','Posortuj kolumny','Zwolnij taśmę'];
function renderBoost(){
  const el=$('#boost');
  if(!el.children.length){
    BICON.forEach((ic,i)=>{
      const b=document.createElement('button');b.className='bb'+(i%2?' g':'');b.setAttribute('aria-label',BNAME[i]);
      b.innerHTML='<span class="ic">'+ic+'</span><span class="bd"></span>';
      b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');useBoost(i,b)});
      b.addEventListener('pointerup',()=>b.classList.remove('down'));
      b.addEventListener('pointerleave',()=>b.classList.remove('down'));
      el.appendChild(b);
    });
  }
  [...el.children].forEach((b,i)=>{const bd=b.querySelector('.bd');bd.className='bd'+(S.boosters[i]>0?' n':'');bd.textContent=S.boosters[i]>0?S.boosters[i]:'+'});
}

/* ---------- akcje ---------- */
function shakeCol(i){const c=cols[i];c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function tapCol(i,silent){
  if(!G||paused)return;
  const el=cols[i].querySelector('.it.top');
  const r=Z.launch(G,i);
  if(!r.ok){
    if(!silent){
      if(r.why==='lock')toast('Zamek: jeszcze '+r.n+' '+plural(r.n,'wrzut','wrzuty','wrzutów'));
      else if(r.why==='ice')toast('Lód: wrzuć jeszcze '+r.n+' '+plural(r.n,'składnik','składniki','składników')+' do zupy');
      else if(r.why==='full')toast('Taśma jest pełna');
      if(r.why!=='state'&&r.why!=='empty')shakeCol(i);
    }
    return;
  }
  if(el){
    const rc=el.getBoundingClientRect(),cr=cv.getBoundingClientRect(),k=cr.width/360,size=el.offsetWidth;
    const c=el.cloneNode(true);c.className='it fly';c.style.margin='0';
    document.body.appendChild(c);
    const sx=rc.left+rc.width/2-size/2,sy=rc.top+rc.height/2-size/2;
    const p0=Z.pos(0),ex=cr.left+p0.x*k-size/2,ey=cr.top+p0.y*k-size/2,se=(38*k)/size;
    c.animate([
      {transform:`translate(${sx}px,${sy}px) scale(1.14) rotate(0)`},
      {transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-60}px) scale(1.25) rotate(-160deg)`,offset:.5},
      {transform:`translate(${ex}px,${ey}px) scale(${se}) rotate(-360deg)`}
    ],{duration:Z.FLY*1000,easing:'cubic-bezier(.4,.1,.5,1)',fill:'forwards'}).onfinish=()=>c.remove();
  }
  if(r.item.candy){
    S.candy++;
    if(el){
      const rc=el.getBoundingClientRect(),hr=$('#candyhud').getBoundingClientRect();
      const c=document.createElement('div');c.innerHTML=CANDY;c.style.cssText='position:fixed;left:0;top:0;z-index:8;pointer-events:none';
      document.body.appendChild(c);
      c.animate([{transform:`translate(${rc.right-10}px,${rc.top}px) scale(1.4)`},{transform:`translate(${hr.left+10}px,${hr.top}px) scale(1)`}],{duration:600,easing:'cubic-bezier(.5,0,.5,1)'}).onfinish=()=>{c.remove();bump('#candyhud');$('#candy').textContent=S.candy};
    }
  }
  handleEvents();renderStacks();updateHUD();save();
}
function useBoost(i,btn){
  if(!G||paused||G.state!=='play')return;
  if(S.boosters[i]<=0){
    if(S.candy>=5){S.candy-=5;S.boosters[i]++;save();updateHUD();toast('Kupiono: '+BNAME[i]+' (−5 cukierków)')}
    else toast('Potrzebujesz 5 cukierków, żeby dokupić');
    return;
  }
  if(i===0){hintUntil=performance.now()+8000;setTimeout(()=>{if(G)renderStacks()},8100);toast('Złote składniki pasują do zamówień')}
  if(i===1){
    const n=Z.sweep(G,false);
    if(!n){toast('Na taśmie nie ma nic zbędnego');return}
    for(let k=0;k<12;k++){const p=Z.pos(Math.random()*Z.P);sparkle(p.x,p.y,3)}
    toast('Wyrzucono '+n+' '+plural(n,'składnik','składniki','składników'));
  }
  if(i===2){Z.shuffle(G);prevTop=[0,0,0];toast('Kolumny posortowane według zamówień')}
  if(i===3){Z.slow(G);toast('Taśma zwolniona na 8 sekund')}
  G.boosts++;
  S.boosters[i]--;
  btn.classList.remove('used');void btn.offsetWidth;btn.classList.add('used');
  handleEvents();renderStacks();updateHUD();save();
}

/* ---------- wygrana / przegrana ---------- */
function onWin(){
  const stars=(G.boosts===0&&G.revives===0)?3:(G.boosts+G.revives<=2?2:1);
  const L=G.level;
  S.stars[L]=Math.max(S.stars[L]||0,stars);
  S.level=L+1;S.maxLevel=Math.max(S.maxLevel,S.level);S.candy+=3;
  save();
  for(let i=0;i<8;i++)setTimeout(()=>confetti(rr_(40,320),rr_(30,220),24,220),i*120);
  setTimeout(()=>{
    $('#wT').textContent='Poziom '+L+' ukończony!';
    $('#wP').textContent='Premia: 3 cukierki'+(stars<3?'. 3 gwiazdki dostaniesz bez boosterów.':'.');
    const sp=[...$('#wS').children];
    sp.forEach((s,i)=>{s.className=(i<stars?'on':'');setTimeout(()=>s.classList.add('go'),350+i*260)});
    $('#mWin').classList.add('show');
    updateHUD();
  },1000);
}
function onLose(){
  const app=$('#app');app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');
  save();
  setTimeout(()=>{
    const b=$('#lRev');
    if(S.boosters[1]>0)b.textContent='Użyj 🧹 i graj dalej ('+S.boosters[1]+')';
    else if(S.candy>=5)b.textContent='Wyczyść taśmę za 5 cukierków';
    else b.textContent='Brak miotły i cukierków';
    b.disabled=!(S.boosters[1]>0||S.candy>=5);b.style.opacity=b.disabled?.5:1;
    $('#mLose').classList.add('show');
  },700);
}
$('#wB').addEventListener('click',()=>startLevel(S.level));
$('#lRetry').addEventListener('click',()=>startLevel(G.level));
$('#lRev').addEventListener('click',()=>{
  if(S.boosters[1]>0)S.boosters[1]--;else if(S.candy>=5)S.candy-=5;else return;
  Z.revive(G);
  for(let k=0;k<14;k++){const p=Z.pos(Math.random()*Z.P);sparkle(p.x,p.y,3)}
  hideModals();handleEvents();renderStacks();updateHUD();save();
});
function hideModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));paused=false}

/* ---------- pętla ---------- */
let last=performance.now(),paused=true;
function uiStep(dt){
  for(let i=FX.flies.length-1;i>=0;i--){
    const f=FX.flies[i];f.t+=dt/0.38;
    if(f.t>=1){
      splash(f.x1,f.y1,f.slot===0?['#ff8d7b','#ffc2b3','#ffd9cf']:['#e8ebef','#c5cad2','#ffffff'],10);
      let px,py;do{const a=Math.random()*PI2,r=Math.sqrt(Math.random())*70;px=Math.cos(a)*r;py=Math.sin(a)*r}while(f.slot===0?px>-8:px<8);
      FX.pot.push({e:f.e,slot:f.slot,x:180+px,y:180+py,ph:Math.random()*6,born:performance.now()});
      if(FX.pot.length>24)FX.pot.shift();
      FX.flies.splice(i,1);
    }
  }
  for(let i=FX.parts.length-1;i>=0;i--){
    const p=FX.parts[i];p.life-=dt;if(p.life<=0){FX.parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.r+=p.vr*dt;
  }
  for(let i=FX.ripples.length-1;i>=0;i--){FX.ripples[i].t+=dt/0.6;if(FX.ripples[i].t>=1)FX.ripples.splice(i,1)}
  FX.steamAcc+=dt;
  if(FX.steamAcc>0.12){FX.steamAcc=0;FX.steam.push({x:180+rr_(-60,60),y:180+rr_(-40,40),r:rr_(9,16),life:2.4,max:2.4,vx:rr_(-8,8)})}
  for(let i=FX.steam.length-1;i>=0;i--){const s=FX.steam[i];s.life-=dt;if(s.life<=0){FX.steam.splice(i,1);continue}s.y-=24*dt;s.x+=s.vx*dt;s.r+=7*dt}
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!paused){
    Z.step(G,dt,S.mul);
    const had=G.ev.length;
    if(handleEvents())renderStacks();
    if(had)updateHUD();
  }
  uiStep(dt);
  if(G)draw(now);
  updateBelt();
  requestAnimationFrame(frame);
}

/* ---------- rysowanie ---------- */
function beltPath(){
  const {X0,Y0,X1,Y1,R}=Z;
  ctx.beginPath();
  ctx.moveTo(X0,Y1-R);ctx.lineTo(X0,Y0+R);ctx.arc(X0+R,Y0+R,R,Math.PI,1.5*Math.PI);
  ctx.lineTo(X1-R,Y0);ctx.arc(X1-R,Y0+R,R,1.5*Math.PI,2*Math.PI);
  ctx.lineTo(X1,Y1-R);ctx.arc(X1-R,Y1-R,R,0,0.5*Math.PI);
  ctx.lineTo(X0+R,Y1);ctx.arc(X0+R,Y1-R,R,0.5*Math.PI,Math.PI);
}
function draw(now){
  const k=cv.width/360;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,360,360);
  /* taśma */
  ctx.save();ctx.lineJoin='round';
  beltPath();ctx.lineWidth=54;ctx.strokeStyle='rgba(0,0,0,.32)';ctx.save();ctx.translate(0,5);ctx.stroke();ctx.restore();
  const layers=[[52,'#8b5733'],[50,'#e9bf96'],[42,'#c28a5c'],[36,'#a46a42'],[32,'#ad7249']];
  layers.forEach(([w,c])=>{beltPath();ctx.lineWidth=w;ctx.strokeStyle=c;ctx.stroke()});
  beltPath();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();
  ctx.restore();
  const n=Math.round(Z.P/60),spc=Z.P/n,o=G.off%spc;
  ctx.save();ctx.strokeStyle='rgba(233,191,150,.8)';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<n;i++){
    const p=Z.pos(i*spc+o);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(5,0);ctx.lineTo(-4,8);ctx.stroke();ctx.restore();
  }
  ctx.restore();
  ctx.save();ctx.lineWidth=2.5;ctx.setLineDash([3,4]);ctx.lineDashOffset=-now/60;ctx.strokeStyle='rgba(255,255,255,.55)';
  Z.PICKS.forEach(d=>{const p=Z.pos(d);ctx.beginPath();ctx.arc(p.x,p.y,23,0,PI2);ctx.stroke()});
  ctx.restore();
  /* garnek z animacją wejścia */
  const intro=Math.min(1,(now-FX.levelAt)/650);
  ctx.save();ctx.translate(180,180);const ps=0.55+0.45*easeBack(intro);ctx.scale(ps,ps);ctx.rotate((1-intro)*-0.5);ctx.translate(-180,-180);
  drawPot(now);
  ctx.restore();
  FX.steam.forEach(s=>{
    const a=Math.sin(Math.PI*(1-s.life/s.max))*0.17;
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,PI2);ctx.fill();
  });
  /* zamówienia */
  for(let i=FX.out.length-1;i>=0;i--){
    const b=FX.out[i],t=(now-b.born)/500;if(t>=1){FX.out.splice(i,1);continue}
    drawBadge(b.o,BADGE[b.slot].x,BADGE[b.slot].y-t*30,1+t*0.5,1-t,b.done);
  }
  G.active.forEach((o,i)=>{
    if(!o)return;
    const bd=FX.badge[i];const t=Math.max(0,Math.min(1,(now-bd.born)/420));if(t<=0)return;
    let sc=easeBack(t);
    const fl=bd.flash-now;if(fl>0)sc*=1+0.3*(fl/350);
    drawBadge(o,BADGE[i].x,BADGE[i].y,sc,1,false);
  });
  /* składniki na taśmie */
  G.belt.forEach(b=>{
    const p=Z.pos(b.d);
    const age=Math.min(1,(G.time-b.born)/0.28);
    const sc=age<1?0.3+0.7*easeBack(age):1;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(now/260+b.d/40)*0.12);ctx.scale(sc,sc);
    ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(0,5,18,15,0,0,PI2);ctx.fill();
    ctx.fillStyle=TYPES[b.t].c;ctx.beginPath();ctx.arc(0,0,19,0,PI2);ctx.fill();
    const g=ctx.createRadialGradient(-7,-8,1,0,0,20);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.18)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,19,0,PI2);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,19,0,PI2);ctx.stroke();
    emo(TYPES[b.t].e,0,1,28);
    ctx.restore();
  });
  FX.ripples.forEach(r=>{ctx.save();ctx.globalAlpha=(1-r.t)*.8;ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.beginPath();ctx.ellipse(r.x,r.y,6+r.t*32,(6+r.t*32)*.7,0,0,PI2);ctx.stroke();ctx.restore()});
  FX.flies.forEach(f=>{
    const t=Math.min(1,f.t),e=t*t*(3-2*t);
    const x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-40*Math.sin(Math.PI*t);
    ctx.save();ctx.translate(x,y);ctx.rotate(t*6);emo(f.e,0,0,30*(1-0.35*t));ctx.restore();
  });
  FX.parts.forEach(p=>{
    const a=Math.max(0,p.life/p.max);ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);
    if(p.k==='text'){ctx.font=p.size+'px '+FONT_TXT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#7a3a10';const sc=1+0.3*Math.max(0,(a-0.8)*5);ctx.translate(p.x,p.y);ctx.scale(sc,sc);ctx.strokeText(p.s,0,0);ctx.fillStyle=p.c;ctx.fillText(p.s,0,0)}
    else if(p.k==='conf'){ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    else if(p.k==='star'){ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.beginPath();for(let j=0;j<8;j++){const rr2=j%2?p.s*.35:p.s;ctx.lineTo(Math.cos(j*Math.PI/4)*rr2,Math.sin(j*Math.PI/4)*rr2)}ctx.fill()}
    else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+.6*a),0,PI2);ctx.fill()}
    ctx.restore();
  });
}
function anise(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  for(let i=0;i<8;i++){
    ctx.rotate(PI2/8);
    ctx.fillStyle='#6b3a1a';ctx.beginPath();ctx.ellipse(r*.55,0,r*.5,r*.2,0,0,PI2);ctx.fill();
    ctx.fillStyle='#8a5326';ctx.beginPath();ctx.ellipse(r*.58,0,r*.28,r*.09,0,0,PI2);ctx.fill();
  }
  ctx.fillStyle='#4a2610';ctx.beginPath();ctx.arc(0,0,r*.25,0,PI2);ctx.fill();
  ctx.restore();
}
function drawPot(now){
  const cx=180,cy=180;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,10,113,108,0,0,PI2);ctx.fill();
  [-0.62,2.52].forEach(a=>{
    ctx.save();ctx.rotate(a);ctx.translate(102,0);
    ctx.fillStyle='#d8cbb6';rr(-6,-16,36,36,11);ctx.fill();
    ctx.fillStyle='#fff8ea';rr(-6,-19,36,36,11);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#cdbda3';ctx.stroke();
    ctx.restore();
    emo('🐟',Math.cos(a)*114,Math.sin(a)*114-2,20);
  });
  const og=ctx.createLinearGradient(0,-110,0,118);og.addColorStop(0,'#ffa174');og.addColorStop(1,'#d24f2a');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(0,5,111,0,PI2);ctx.fill();
  const rg=ctx.createRadialGradient(-20,-30,40,0,0,108);rg.addColorStop(0,'#fffcf6');rg.addColorStop(1,'#e0d3bf');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,107,0,PI2);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#c9b9a0';ctx.stroke();
  ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(0,0,103,Math.PI*1.08,Math.PI*1.45);ctx.stroke();
  ctx.save();
  ctx.beginPath();ctx.arc(0,0,94,0,PI2);ctx.clip();
  const gg=ctx.createRadialGradient(40,-30,10,0,0,110);gg.addColorStop(0,'#a9aeb7');gg.addColorStop(1,'#767b85');
  ctx.fillStyle=gg;ctx.fillRect(-100,-100,200,200);
  const rg2=ctx.createRadialGradient(-35,-20,6,-20,0,115);rg2.addColorStop(0,'#f26257');rg2.addColorStop(1,'#bd3632');
  ctx.fillStyle=rg2;
  ctx.beginPath();ctx.arc(0,0,94,Math.PI/2,1.5*Math.PI);ctx.fill();
  ctx.beginPath();ctx.arc(0,-47,47,0,PI2);ctx.fill();
  ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,47,47,0,PI2);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,205,185,.22)';
  for(let j=0;j<6;j++){ctx.beginPath();for(let x=-90;x<=0;x+=6){const y=-70+j*26+Math.sin(x/14+now/420+j)*3;x===-90?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
  ctx.strokeStyle='rgba(255,255,255,.1)';
  for(let j=0;j<5;j++){ctx.beginPath();for(let x=0;x<=90;x+=6){const y=-60+j*28+Math.sin(x/14-now/520+j)*2.5;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
  for(let i=0;i<10;i++){
    const bx=-78+((i*37)%72),by=72-((now/26+i*43)%150);
    ctx.fillStyle='rgba(255,185,165,.4)';ctx.beginPath();ctx.arc(bx,by,3+(i%3),0,PI2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(bx-1,by-1,1,0,PI2);ctx.fill();
  }
  anise(-58+Math.sin(now/900)*3,-30+Math.cos(now/800)*2,15,now/2400);
  anise(-20+Math.cos(now/1000)*3,-64+Math.sin(now/760)*2,11,-now/2000);
  ctx.save();ctx.translate(-76+Math.sin(now/700)*2,-4+Math.cos(now/650)*2);ctx.rotate(Math.sin(now/900)*.3);emo('🌿',0,0,24);ctx.restore();
  ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.arc(2,-45,47,-Math.PI/2,Math.PI/2,false);ctx.arc(2,49,47,-Math.PI/2,Math.PI/2,true);ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle='#fbf4e6';
  ctx.beginPath();ctx.arc(0,-47,47,-Math.PI/2,Math.PI/2,false);ctx.arc(0,47,47,-Math.PI/2,Math.PI/2,true);ctx.stroke();
  FX.pot.forEach(p=>{
    const age=Math.min(1,(now-p.born)/300);
    ctx.save();ctx.translate(p.x-cx,p.y-cy+Math.sin(now/500+p.ph)*2.2);ctx.rotate(Math.sin(now/700+p.ph)*.25);
    ctx.scale(age,age);emo(p.e,0,0,20);ctx.restore();
  });
  ctx.restore();
  ctx.restore();
}
function drawBadge(o,x,y,scale,alpha,done){
  ctx.save();ctx.globalAlpha=Math.max(0,alpha);ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.fillStyle='rgba(0,0,0,.28)';rr(-38,-19,76,46,14);ctx.fill();
  const g=ctx.createLinearGradient(0,-23,0,23);g.addColorStop(0,done?'#eaffd9':'#fffaf0');g.addColorStop(1,done?'#a9e58a':'#f3e2bf');
  ctx.fillStyle=g;rr(-38,-23,76,46,14);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=done?'#5fae3c':'#d6bd8f';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';rr(-32,-20,64,6,3);ctx.fill();
  emo(TYPES[o.t].e,-18,1,30);
  ctx.font='26px '+FONT_TXT;ctx.textAlign='center';ctx.textBaseline='middle';
  const txt=done?'✓':'x'+o.left;
  ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle=done?'#2c7a1d':'#8a5a2b';ctx.strokeText(txt,17,2);
  ctx.fillStyle='#fff';ctx.fillText(txt,17,2);
  if(o.locked){
    ctx.fillStyle='rgba(55,58,70,.62)';rr(-38,-23,76,46,14);ctx.fill();
    ctx.lineWidth=5;ctx.setLineDash([7,4]);ctx.strokeStyle='#b6bcc7';
    ctx.beginPath();ctx.moveTo(-35,-14);ctx.lineTo(35,14);ctx.moveTo(-35,14);ctx.lineTo(35,-14);ctx.stroke();ctx.setLineDash([]);
    emo('🔒',0,0,28);
  }
  ctx.restore();
}

/* ---------- sterowanie: dotyk rowu, szybkie klikanie i przytrzymanie ---------- */
let hold=null,holdCol=-1;
function stopHold(){if(hold){clearInterval(hold);hold=null}if(holdCol>=0)cols[holdCol].classList.remove('press');holdCol=-1}
function nearestCol(x){
  let best=-1,bd=1e9;
  cols.forEach((c,i)=>{const r=c.getBoundingClientRect();const d=x<r.left?r.left-x:x>r.right?x-r.right:0;const sc=d*1000+Math.abs(x-(r.left+r.right)/2);if(sc<bd){bd=sc;best=i}});
  return best;
}
stacksEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const i=nearestCol(e.clientX);if(i<0)return;
  stopHold();
  holdCol=i;cols[i].classList.add('press');
  tapCol(i);
  const iv=Math.round(1000*Z.GAP/(Z.BASE*S.mul))+15;
  const start=performance.now();
  hold=setInterval(()=>{if(performance.now()-start>260)tapCol(i,true)},iv);
});
window.addEventListener('pointerup',stopHold);
window.addEventListener('pointercancel',stopHold);
window.addEventListener('blur',stopHold);
/* blokada przybliżania na iPhonie przy szybkim podwójnym stuknięciu */
['#stacks','#boost','#cv','#top','#prog'].forEach(sel=>{
  const el=$(sel);
  el.addEventListener('touchstart',e=>{if(e.target.closest('#top button'))return;e.preventDefault()},{passive:false});
  el.addEventListener('touchend',e=>{if(e.target.closest('#top button'))return;e.preventDefault()},{passive:false});
});
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350&&!e.target.closest('input,textarea,.modal'))e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- menu ---------- */
$('#spd').addEventListener('click',()=>{S.mul=S.mul%3+1;save();$('#spdt').textContent='x'+S.mul;toast('Prędkość taśmy: x'+S.mul,900)});
$('#gear').addEventListener('click',()=>{$('#mLvl').value=G?G.level:S.level;$('#codeBox').style.display='none';paused=true;$('#mMenu').classList.add('show')});
$('#mClose').addEventListener('click',hideModals);
$('#mRestart').addEventListener('click',()=>startLevel(G.level));
$('#mGo').addEventListener('click',()=>{const v=Math.max(1,Math.min(99999,parseInt($('#mLvl').value,10)||1));S.maxLevel=Math.max(S.maxLevel,v);startLevel(v)});
$('#mReset').addEventListener('click',()=>{if(!confirm('Na pewno usunąć cały postęp?'))return;S=S0();save();startLevel(1)});
function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
$('#mExport').addEventListener('click',()=>{
  const code=encode({level:S.level,maxLevel:S.maxLevel,candy:S.candy,boosters:S.boosters,mul:S.mul,seen:S.seen,stars:S.stars});
  $('#codeBox').style.display='block';$('#code').value=code;$('#codeOk').textContent='Skopiuj kod';
  $('#codeOk').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>toast('Skopiowano kod zapisu'),()=>{$('#code').select();toast('Zaznacz i skopiuj kod')})}catch(e){$('#code').select()}};
});
$('#mImport').addEventListener('click',()=>{
  $('#codeBox').style.display='block';$('#code').value='';$('#code').placeholder='Wklej tutaj kod zapisu';$('#codeOk').textContent='Wczytaj';
  $('#codeOk').onclick=()=>{
    try{
      const j=decode($('#code').value);if(!j||!j.level)throw 0;
      S=Object.assign(S0(),{level:+j.level||1,maxLevel:+j.maxLevel||+j.level||1,candy:+j.candy||0,boosters:Array.isArray(j.boosters)?j.boosters:[3,3,3,3],mul:[1,2,3].includes(j.mul)?j.mul:1,seen:j.seen||{},stars:j.stars||{}});
      save();toast('Wczytano zapis');startLevel(S.level);
    }catch(e){toast('Ten kod nie wygląda na zapis Zupnika')}
  };
});

/* ---------- autozapis ---------- */
setInterval(save,2000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);

/* ---------- start ---------- */
resize();new ResizeObserver(resize).observe(cv);
let resumed=false;
try{if(S.game){startLevel(S.level,S.game);resumed=true}}catch(e){resumed=false}
if(!resumed)startLevel(S.level);
paused=true;
$('#startLvl').textContent=(resumed?'Wracasz do poziomu ':'Poziom ')+S.level;
$('#play').addEventListener('click',()=>{
  $('#start').classList.add('hide');
  setTimeout(()=>$('#start').style.display='none',420);
  paused=false;FX.levelAt=performance.now();FX.badge=[{born:performance.now()+300,flash:0},{born:performance.now()+450,flash:0}];
  showBanner();
});
requestAnimationFrame(frame);
})();
</script>
