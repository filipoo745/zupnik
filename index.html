<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zupnik</title>
<meta name="theme-color" content="#6a0f1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zupnik">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#6a0f1b;
  --cream:#fbe9cc;
  --brown:#5a2d12;
  --font:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 38%,rgba(255,90,70,.22),transparent 60%),
    radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.55),transparent 55%),
    repeating-radial-gradient(circle at 25% 20%,rgba(255,255,255,.035) 0 2px,transparent 2px 24px),
    repeating-radial-gradient(circle at 80% 70%,rgba(0,0,0,.09) 0 2px,transparent 2px 26px);
  font-family:var(--font);color:#fff;overflow:hidden;touch-action:manipulation;
}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:0 10px}
#top{display:flex;align-items:center;justify-content:space-between;height:66px;flex:none;padding:6px 4px 0}
.hud{display:flex;flex-direction:column;align-items:center;font-size:17px;line-height:1;min-width:46px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hud svg{display:block}
.hud.bump{animation:bump .35s ease-out}
#lvl{
  font-size:28px;padding:3px 24px 5px;border-radius:16px;border:3px solid #7d1018;position:relative;overflow:hidden;
  background:linear-gradient(#f2564b,#c4222a);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.4);letter-spacing:.3px
}
#lvl::after{content:"";position:absolute;top:0;bottom:0;width:30px;left:-40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
.tb{background:none;border:0;padding:0;color:#fff;font-family:var(--font);position:relative;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
.tb svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.tb:active{transform:scale(.92)}
#gear svg{transition:transform .5s}
#gear:active svg{transform:rotate(90deg)}
#spd small{position:absolute;right:-2px;bottom:-2px;font-size:20px;color:#fff;text-shadow:0 2px 0 #7d1018,0 0 4px #7d1018}
#stage{flex:none;display:flex;justify-content:center}
#cv{width:min(100%,44dvh);aspect-ratio:1;display:block}
#prog{
  flex:none;align-self:center;position:relative;width:min(78%,330px);height:30px;margin:2px 0 6px;
  border-radius:15px;background:#46250f;border:3px solid #dcab78;overflow:hidden;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 3px 6px rgba(0,0,0,.45)
}
#pfill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#c58245,#8f5528);transition:width .35s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
#ptxt{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#stacks{flex:1;min-height:0;display:flex;gap:16px;justify-content:center;padding:0 22px;touch-action:manipulation}
.col{
  flex:1;max-width:124px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:10px 0 0;border-radius:8px 8px 0 0;cursor:pointer;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),
    linear-gradient(90deg,#46230f,#6d3c1e 14%,#6d3c1e 86%,#46230f);
  border:3px solid #b07a46;border-bottom:0;box-shadow:inset 0 6px 12px rgba(0,0,0,.35);
  -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent);
  transition:filter .15s
}
.col:active{filter:brightness(1.18)}
.col.shake{animation:shake .25s}
.it{
  --c:#fff;
  width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-top:-5px;position:relative;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 70%,#000));
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.1);border:2px solid rgba(255,255,255,.9);
  font-family:var(--emoji);pointer-events:none
}
.it.hid{--c:#7b6586;filter:saturate(.8)}
.it:first-child{margin-top:0}
.it.top{transform:scale(1.14);margin-bottom:5px;animation:idle 2.4s ease-in-out infinite}
.it.top.pop{animation:pop .32s cubic-bezier(.2,1.5,.4,1),idle 2.4s ease-in-out .32s infinite}
.it.locked{filter:saturate(.55) brightness(.9)}
.it.unl{animation:unl .5s ease-out}
.it.hint{box-shadow:0 0 0 3px #ffd23f,0 0 16px 5px rgba(255,210,63,.8);animation:glow 1s ease-in-out infinite}
.it.fly{position:fixed;left:0;top:0;margin:0;z-index:7}
.it .cd{position:absolute;right:-7px;top:-9px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.lk{position:absolute;right:-10px;bottom:-9px;background:#3a3a48;border:2px solid #fff;border-radius:10px;padding:0 6px;font:13px/17px var(--font);color:#fff;white-space:nowrap}
.lid{
  width:68px;height:42px;flex:none;margin-top:-4px;border-radius:11px;position:relative;pointer-events:none;
  background:linear-gradient(#fafbfc,#b4bbc4 52%,#dfe3e8);box-shadow:0 3px 0 #6b727c,inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.12);border:2px solid #8e959e
}
.lid:first-child{margin-top:0}
.lid i{position:absolute;left:50%;top:50%;width:8px;height:20px;border-radius:5px;transform:translate(-50%,-50%);background:linear-gradient(90deg,#7c838d,#e8ebee 40%,#7c838d);box-shadow:0 1px 0 rgba(255,255,255,.7)}
.cnt{position:absolute;bottom:6px;right:6px;font-size:15px;color:#ffe9c4;text-shadow:0 1px 0 #000;z-index:2}
#boost{flex:none;display:flex;gap:12px;padding:8px 4px 12px}
.bb{
  flex:1;height:64px;border-radius:18px;border:0;position:relative;font-size:34px;cursor:pointer;
  background:linear-gradient(#fdeed3,#efd1a0);box-shadow:0 4px 0 #b3854d,inset 0 2px 0 rgba(255,255,255,.75);
  font-family:var(--emoji)
}
.bb.g{background:linear-gradient(#d9dce2,#afb4be);box-shadow:0 4px 0 #6f7480,inset 0 2px 0 rgba(255,255,255,.65)}
.bb:active{transform:translateY(3px);box-shadow:0 1px 0 #b3854d}
.bb span.ic{display:inline-block;transition:transform .2s}
.bb:active span.ic{transform:scale(1.25) rotate(-8deg)}
.bd{
  position:absolute;right:-6px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:#2ea043;color:#fff;
  font:20px/1 var(--font);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)
}
.bd.n{background:#8a1624}
#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  background:rgba(40,8,12,.94);border:2px solid #dcab78;padding:8px 16px;border-radius:14px;font-size:18px;text-align:center;line-height:1.2;
  max-width:90%;transition:.2s;z-index:9
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(30,0,5,.72);display:none;place-items:center;z-index:8}
.modal.show{display:grid}
.modal.show .card{animation:cardin .4s cubic-bezier(.2,1.4,.4,1)}
.card{background:var(--cream);color:var(--brown);border-radius:24px;padding:22px 20px;width:min(86%,340px);text-align:center;box-shadow:0 8px 0 #b3854d}
.card h2{margin:0 0 6px;font-size:30px;font-weight:400}
.card p{margin:0 0 14px;font-size:19px;line-height:1.25}
.btn{
  display:block;width:100%;margin-top:10px;padding:10px 12px 12px;border:0;border-radius:16px;font:23px/1 var(--font);color:#fff;cursor:pointer;
  background:linear-gradient(#f2564b,#c4222a);box-shadow:0 4px 0 #7d1018,inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.35)
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1018}
.btn.alt{background:linear-gradient(#bf9164,#8d6240);box-shadow:0 4px 0 #5a3a20,inset 0 2px 0 rgba(255,255,255,.3)}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0;border:3px solid #c9a06f;border-radius:14px;background:#fff8ea;color:var(--brown);font:22px var(--font);text-align:center;padding:6px}
.row .btn{margin:0;width:auto;padding:10px 16px 12px}
@keyframes idle{0%,100%{transform:scale(1.14) translateY(0)}50%{transform:scale(1.18) translateY(-2px)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1.14)}}
@keyframes glow{50%{transform:scale(1.22)}}
@keyframes unl{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-12deg)}60%{transform:scale(.95) rotate(8deg)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bump{40%{transform:scale(1.28)}}
@keyframes shine{0%,70%{left:-40px}100%{left:140%}}
@keyframes cardin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.it.top,.it.top.pop,.it.hint,#lvl::after{animation:none}}
@media (max-height:640px){.it{width:40px;height:40px;font-size:24px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="hud" id="starhud">
      <svg width="46" height="44" viewBox="0 0 24 24"><defs><linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop id="s1" offset="0" stop-color="#ffcf3a"/><stop id="s2" offset="0" stop-color="#3a2a14"/></linearGradient></defs><path d="M12 1.8l2.9 6.2 6.7.8-4.9 4.6 1.3 6.7L12 16.7 6 20.1l1.3-6.7L2.4 8.8l6.7-.8z" fill="url(#sg)" stroke="#2a1608" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="pct">0%</span>
    </div>
    <div class="hud" id="candyhud"><span id="candyico"></span><span id="candy">0</span></div>
    <div id="lvl">Poziom 1</div>
    <button class="tb" id="spd" aria-label="Prędkość taśmy">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M3 4l9 8-9 8zM12 4l9 8-9 8z" fill="#ffb81f" stroke="#c97a00" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <small id="spdt">x1</small>
    </button>
    <button class="tb" id="gear" aria-label="Menu">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 8.4a3.6 3.6 0 100 7.2 3.6 3.6 0 000-7.2zm9 4.6v-2l-2.2-.6a7 7 0 00-.7-1.7l1.2-2-1.4-1.4-2 1.2a7 7 0 00-1.7-.7L13.6 3h-2l-.6 2.2a7 7 0 00-1.7.7l-2-1.2L5.9 6.1l1.2 2a7 7 0 00-.7 1.7L4.2 11v2l2.2.6c.2.6.4 1.2.7 1.7l-1.2 2 1.4 1.4 2-1.2c.5.3 1.1.5 1.7.7l.6 2.2h2l.6-2.2c.6-.2 1.2-.4 1.7-.7l2 1.2 1.4-1.4-1.2-2c.3-.5.5-1.1.7-1.7z" fill="#ffb81f" stroke="#c97a00" stroke-width="1" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="prog"><div id="pfill"></div><div id="ptxt">0/0</div></div>
  <div id="stacks"></div>
  <div id="boost"></div>
</div>
<div id="toast"></div>

<div class="modal" id="mEnd"><div class="card"><h2 id="eT"></h2><p id="eP"></p><button class="btn" id="eB"></button></div></div>
<div class="modal" id="mMenu"><div class="card">
  <h2>Zupnik</h2><p>Gra zapisuje się automatycznie.</p>
  <button class="btn alt" id="mRestart">Zacznij poziom od nowa</button>
  <div class="row"><input id="mLvl" type="number" min="1" inputmode="numeric" aria-label="Numer poziomu"><button class="btn alt" id="mGo">Idź</button></div>
  <button class="btn alt" id="mReset">Resetuj cały postęp</button>
  <button class="btn" id="mClose">Wróć do gry</button>
</div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const FONT_EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT_TXT='"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
const PI2=Math.PI*2;
const TYPES=[
  {e:'🥩',c:'#f6c9c4'},{e:'🍄',c:'#efe3cf'},{e:'🥬',c:'#d6efc2'},{e:'🐟',c:'#cde6f6'},
  {e:'🍤',c:'#fbd9bd'},{e:'🥕',c:'#fde0b0'},{e:'🍆',c:'#e3d0ee'},{e:'🥑',c:'#dcebb5'},{e:'🥟',c:'#f6ecd0'}
];
const CANDY='<svg class="cd" width="18" height="22" viewBox="0 0 24 30"><g stroke-linejoin="round" stroke-width="1.6"><polygon points="12,2 15.1,10 8.9,10" fill="#fff" stroke="#fff"/><polygon points="8.9,10 15.1,10 17.2,19 6.8,19" fill="#ff9a1f" stroke="#ff9a1f"/><polygon points="6.8,19 17.2,19 21,28 3,28" fill="#ffd62e" stroke="#ffd62e"/></g></svg>';
$('#candyico').innerHTML=CANDY.replace('class="cd" width="18" height="22"','width="30" height="36"');

/* ---------- save ---------- */
const KEY='zupnik-v1';
const S0=()=>({level:1,candy:0,boosters:[3,3,3,3],mul:1,seen:{}});
let S=S0();
try{
  const j=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('hotpot-v2'))||JSON.parse(localStorage.getItem('hotpot-v1'));
  if(j&&j.level)S=Object.assign(S,j);
}catch(e){}
if(!S.seen)S.seen={};
if(![1,2,3].includes(S.mul))S.mul=1;
function save(){try{S.game=snapshot();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- belt geometry ---------- */
const X0=28,Y0=28,X1=332,Y1=332,R=52;
const Ls=Y1-Y0-2*R,Lh=X1-X0-2*R,ARC=R*Math.PI/2;
const segs=[
  {len:Ls,f:u=>({x:X0,y:Y1-R-u,a:-Math.PI/2})},
  {len:ARC,f:u=>{const t=Math.PI+u/R;return{x:X0+R+R*Math.cos(t),y:Y0+R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Lh,f:u=>({x:X0+R+u,y:Y0,a:0})},
  {len:ARC,f:u=>{const t=1.5*Math.PI+u/R;return{x:X1-R+R*Math.cos(t),y:Y0+R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Ls,f:u=>({x:X1,y:Y0+R+u,a:Math.PI/2})},
  {len:ARC,f:u=>{const t=u/R;return{x:X1-R+R*Math.cos(t),y:Y1-R+R*Math.sin(t),a:t+Math.PI/2}}},
  {len:Lh,f:u=>({x:X1-R-u,y:Y1,a:Math.PI})},
  {len:ARC,f:u=>{const t=Math.PI/2+u/R;return{x:X0+R+R*Math.cos(t),y:Y1-R+R*Math.sin(t),a:t+Math.PI/2}}}
];
const P=segs.reduce((s,g)=>s+g.len,0);
function pos(d){d=((d%P)+P)%P;for(const g of segs){if(d<=g.len)return g.f(d);d-=g.len}return segs[0].f(0)}
const PICKS=[Ls+ARC+Lh/2, Ls+ARC+Lh+ARC+Ls/2, Ls+ARC+Lh+ARC+Ls+ARC+Lh/2];
const BASE=168,GAP=40;
const BADGE=[{x:128,y:202},{x:234,y:158}];

/* ---------- canvas ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.max(2,Math.round(r.width*dpr));cv.height=Math.max(2,Math.round(r.height*dpr))}
window.addEventListener('resize',resize);

/* ---------- helpers ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const rr_=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let toastT;
function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms||1800)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bump(sel){const el=$(sel);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function wrzut(n){return n===1?'wrzucie':'wrzutach'}

/* ---------- game ---------- */
let G=null;
const INTROS=[
  [5,'lock','Zamek 🔒: składnik odblokuje się po kilku wrzutach z innych kolumn.'],
  [7,'lid','Pokrywa: dotknij kolumny, żeby ją zdjąć. To kosztuje jeden ruch.'],
  [9,'hid','❓ Ukryte składniki odsłonią się, gdy dojdą na górę kolumny.'],
  [12,'ord','Kłódka na garnku: druga połowa otworzy się po skompletowaniu pierwszego zamówienia.']
];
function takeOrder(slot){
  const o=G.queue.shift()||null;if(!o)return null;
  o.flash=performance.now();
  if(slot===1&&G.level>=12&&G.active[0]&&Math.random()<Math.min(.15+(G.level-12)*.02,.6))o.locked=true;
  return o;
}
function newGame(level){
  S.game=null;
  const id=(G?G.id:0)+1;
  const total=Math.min(12+(level-1)*2,28);
  const nT=Math.min(3+Math.floor(level/4),9);
  const pool=shuffle([...Array(9).keys()]).slice(0,nT);
  const orders=[];let left=total,prev=-1;
  while(left>0){
    let q=3+rnd(4);if(q>left)q=left;if(left-q>0&&left-q<3)q=left;
    let t;do{t=pool[rnd(pool.length)]}while(t===prev&&pool.length>1);prev=t;
    orders.push({t,n:q,left:q,flash:0,locked:false});left-=q;
  }
  const noise=1+Math.min(level,60)*0.08;
  const items=[];
  orders.forEach((o,i)=>{for(let k=0;k<o.n;k++)items.push({t:o.t,key:i+Math.random()*noise})});
  const decoys=Math.round(total*(0.25+Math.min(level,40)*0.01));
  for(let k=0;k<decoys;k++)items.push({t:pool[rnd(pool.length)],key:Math.random()*orders.length});
  items.forEach(it=>{it.candy=Math.random()<0.12;it.lock=0;it.hidden=false});
  items.sort((a,b)=>a.key-b.key);
  const stacks=[[],[],[]];
  items.forEach((it,i)=>stacks[i%3].push(it));
  /* przeszkody */
  if(level>=5){
    const n=Math.min(1+Math.floor((level-5)/8),6);
    shuffle(items.slice()).slice(0,n).forEach(it=>{it.lock=3+rnd(3+Math.min(5,Math.floor(level/15)))});
  }
  if(level>=9){
    const frac=Math.min(.12+(level-9)*.01,.5);
    items.forEach(it=>{if(Math.random()<frac)it.hidden=true});
  }
  if(level>=7){
    const nl=Math.min(1+Math.floor((level-7)/12),4);
    for(let k=0;k<nl;k++){const s=stacks[rnd(3)];const idx=1+rnd(Math.max(1,s.length-1));s.splice(idx,0,{t:-1,lid:true,key:0,lock:0})}
  }
  G={id,level,total,delivered:0,cap:Math.max(7,10-Math.floor(level/30)),queue:orders.slice(),active:[null,null],
     stacks,belt:[],inbox:[],flying:0,flyList:[],fx:[],pot:[],parts:[],ripples:[],steam:[],steamAcc:0,
     off:0,hintUntil:0,slowUntil:0,state:'play',startCount:stacks[0].length+stacks[1].length+stacks[2].length,beltShown:-1};
  G.active[0]=takeOrder(0);G.active[1]=takeOrder(1);
  $('#mEnd').classList.remove('show');
  $('#mMenu').classList.remove('show');
  renderStacks();updateHUD();
  if(level===1)toast('Dotknij kolumny (możesz przytrzymać), żeby wrzucać składniki na taśmę.',3200);
  showIntros(level);
}
function snapshot(){
  if(!G||G.state!=='play')return null;
  return{level:G.level,total:G.total,delivered:G.delivered,cap:G.cap,startCount:G.startCount,
    queue:G.queue,active:G.active,stacks:G.stacks,
    belt:G.belt.map(b=>({t:b.t,d:b.d})),
    inbox:G.inbox.map(i=>({t:i.t})).concat(G.flyList.map(t=>({t}))),
    pot:G.pot.map(p=>({e:p.e,slot:p.slot,x:p.x,y:p.y,ph:p.ph}))};
}
function restoreGame(sn){
  const id=(G?G.id:0)+1;
  const fix=o=>{if(o)o.flash=0;return o};
  G={id,level:sn.level,total:sn.total,delivered:sn.delivered,cap:sn.cap,startCount:sn.startCount,
     queue:sn.queue.map(fix),active:sn.active.map(fix),stacks:sn.stacks,
     belt:sn.belt.map(b=>({t:b.t,d:b.d,born:0})),inbox:sn.inbox,flying:0,flyList:[],fx:[],
     pot:sn.pot.map(p=>Object.assign({},p,{born:0})),parts:[],ripples:[],steam:[],steamAcc:0,
     off:0,hintUntil:0,slowUntil:0,state:'play',beltShown:-1};

}
function showIntros(level){
  const list=INTROS.filter(x=>level>=x[0]&&!S.seen[x[1]]);
  list.forEach(x=>S.seen[x[1]]=1);
  if(list.length)save();
  list.forEach((x,i)=>setTimeout(()=>{if(G)toast(x[2],3600)},i*3800+(level===1?0:300)));
}
function matchSet(){return new Set(G.active.filter(o=>o&&o.left>0&&!o.locked).map(o=>o.t))}

/* ---------- DOM render ---------- */
const stacksEl=$('#stacks');
for(let i=0;i<3;i++){const c=document.createElement('div');c.className='col';c.dataset.i=i;stacksEl.appendChild(c)}
const cols=[...stacksEl.children];

function ensureUnlock(){
  const tops=G.stacks.map(s=>s[0]).filter(Boolean);
  if(!tops.length)return;
  if(tops.some(t=>t.lid||!(t.lock>0)))return;
  let m=tops[0];tops.forEach(t=>{if(t.lock<m.lock)m=t});m.lock=0;m.flash=true;
}
function decLocks(){
  G.stacks.forEach(s=>s.forEach(it=>{if(it.lock>0){it.lock--;if(it.lock===0)it.flash=true}}));
}
function renderStacks(popCol){
  ensureUnlock();
  const ms=matchSet(),hint=performance.now()<G.hintUntil;
  cols.forEach((el,i)=>{
    el.innerHTML='';
    const st=G.stacks[i];
    st.forEach((it,k)=>{
      let d;
      if(it.lid){
        d=document.createElement('div');d.className='lid';d.innerHTML='<i></i>';if(k===0)d.dataset.top='1';
      }else{
        const hid=it.hidden&&k>0;
        d=document.createElement('div');
        d.className='it'+(k===0?' top':'')+(k===0&&i===popCol?' pop':'')+(hid?' hid':'')+(it.lock>0?' locked':'')+(it.flash?' unl':'')+(hint&&!hid&&ms.has(it.t)?' hint':'');
        d.style.setProperty('--c',TYPES[it.t].c);
        d.textContent=hid?'❓':TYPES[it.t].e;
        if(it.candy&&!hid)d.insertAdjacentHTML('beforeend',CANDY);
        if(it.lock>0)d.insertAdjacentHTML('beforeend','<span class="lk">🔒'+it.lock+'</span>');
        if(it.flash)it.flash=false;
      }
      el.appendChild(d);
    });
    const n=document.createElement('div');n.className='cnt';n.textContent=st.length>5?st.length:'';el.appendChild(n);
  });
}
function updateHUD(){
  const rem=G.stacks.reduce((a,s)=>a+s.length,0);
  const p=G.startCount?1-rem/G.startCount:0;
  $('#pct').textContent=Math.floor(p*100)+'%';
  $('#s1').setAttribute('offset',p);$('#s2').setAttribute('offset',p);
  $('#candy').textContent=S.candy;
  $('#lvl').textContent='Poziom '+G.level;
  G.beltShown=-1;updateBelt();
  $('#spdt').textContent='x'+S.mul;
  renderBoost();
}
function updateBelt(){
  const n=G.belt.length+G.inbox.length+G.flying;
  if(n===G.beltShown)return;
  G.beltShown=n;
  const f=Math.min(1,n/G.cap);
  const el=$('#pfill');
  el.style.width=(f*100)+'%';
  el.style.background=f>=.99?'linear-gradient(#ff6a5a,#c4222a)':f>=.7?'linear-gradient(#ffb04a,#d9761a)':'linear-gradient(#c58245,#8f5528)';
  $('#ptxt').textContent='Taśma '+n+'/'+G.cap;
}
const BICON=['📋','🧹','🔀','❄️'];
const BNAME=['Podpowiedź','Wyczyść taśmę','Posortuj kolumny','Zwolnij taśmę'];
function renderBoost(){
  const el=$('#boost');el.innerHTML='';
  BICON.forEach((ic,i)=>{
    const b=document.createElement('button');b.className='bb'+(i%2?' g':'');b.setAttribute('aria-label',BNAME[i]);
    b.innerHTML='<span class="ic">'+ic+'</span>';
    const bd=document.createElement('span');bd.className='bd'+(S.boosters[i]>0?' n':'');bd.textContent=S.boosters[i]>0?S.boosters[i]:'+';
    b.appendChild(bd);
    b.addEventListener('click',()=>useBoost(i));
    el.appendChild(b);
  });
}

/* ---------- actions ---------- */
function shakeCol(i){const c=cols[i];c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function tapStack(i,silent){
  if(!G||G.state!=='play')return false;
  const st=G.stacks[i];if(!st.length)return false;
  const top=st[0];
  if(top.lid){removeLid(i);return true}
  if(top.lock>0){
    if(!silent){toast('Zamek: jeszcze '+top.lock+' '+wrzut(top.lock));shakeCol(i)}
    return false;
  }
  if(G.belt.length+G.inbox.length+G.flying>=G.cap){
    if(!silent){toast('Taśma jest pełna');shakeCol(i)}
    return false;
  }
  const el=cols[i].querySelector('.it.top');
  const gid=G.id;
  if(el){
    const rc=el.getBoundingClientRect(),cr=cv.getBoundingClientRect(),k=cr.width/360,size=el.offsetWidth;
    const c=el.cloneNode(true);c.className='it fly';c.style.margin='0';
    document.body.appendChild(c);
    const sx=rc.left+rc.width/2-size/2,sy=rc.top+rc.height/2-size/2;
    const ex=cr.left+X0*k-size/2,ey=cr.top+(Y1-R)*k-size/2,se=(34*k)/size;
    const a=c.animate([
      {transform:`translate(${sx}px,${sy}px) scale(1.14)`},
      {transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-40}px) scale(.95)`,offset:.5},
      {transform:`translate(${ex}px,${ey}px) scale(${se})`}
    ],{duration:340,easing:'cubic-bezier(.4,.1,.5,1)',fill:'forwards'});
    const t=top.t;
    G.flying++;G.flyList.push(t);
    a.onfinish=()=>{c.remove();if(!G||G.id!==gid)return;G.flying--;const ix=G.flyList.indexOf(t);if(ix>-1)G.flyList.splice(ix,1);G.inbox.push({t})};
  }else{G.inbox.push({t:top.t})}
  st.shift();
  if(top.candy){S.candy++;save();bump('#candyhud')}
  decLocks();
  renderStacks(i);updateHUD();
  return true;
}
function removeLid(i){
  const el=cols[i].querySelector('.lid[data-top]');
  if(el){
    const r=el.getBoundingClientRect(),c=el.cloneNode(true);
    Object.assign(c.style,{position:'fixed',left:r.left+'px',top:r.top+'px',margin:'0',zIndex:7,pointerEvents:'none'});
    document.body.appendChild(c);
    const a=c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate(34px,-110px) rotate(28deg)',opacity:0}],{duration:460,easing:'ease-out'});
    a.onfinish=()=>c.remove();
  }
  G.stacks[i].shift();decLocks();renderStacks(i);updateHUD();
}
function useBoost(i){
  if(!G||G.state!=='play')return;
  if(S.boosters[i]<=0){
    if(S.candy>=5){S.candy-=5;S.boosters[i]++;save();updateHUD();toast('Kupiono: '+BNAME[i]+' (−5 cukierków)')}
    else toast('Potrzebujesz 5 cukierków, żeby dokupić');
    return;
  }
  const now=performance.now();
  if(i===0){G.hintUntil=now+8000;setTimeout(()=>{if(G)renderStacks()},8100);toast('Złote składniki pasują do zamówień')}
  if(i===1){
    const ms=matchSet();const before=G.belt.length;
    G.belt=G.belt.filter(b=>ms.has(b.t));
    if(G.belt.length===before){toast('Na taśmie nie ma nic zbędnego');return}
  }
  if(i===2){
    const lids=G.stacks.map(s=>s.filter(it=>it.lid).length);void lids;
    const all=[].concat(...G.stacks).filter(it=>!it.lid);
    const nl=[].concat(...G.stacks).filter(it=>it.lid);
    all.sort((a,b)=>a.key-b.key);
    G.stacks=[[],[],[]];all.forEach((it,k)=>G.stacks[k%3].push(it));
    nl.forEach(l=>{const s=G.stacks[rnd(3)];s.splice(Math.min(s.length,1+rnd(Math.max(1,s.length))),0,l)});
    toast('Kolumny posortowane według zamówień');
  }
  if(i===3){G.slowUntil=now+8000;toast('Taśma zwolniona na 8 sekund')}
  S.boosters[i]--;save();renderStacks();updateHUD();
}

/* efekty */
function splash(x,y,cols_,n){
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+rr_(-1.2,1.2),v=rr_(40,110);
    G.parts.push({k:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:260,life:.6,max:.6,s:rr_(1.8,3.6),c:cols_[rnd(cols_.length)],r:0,vr:0});
  }
  G.ripples.push({x,y,t:0});
}
function confetti(x,y,n,spread){
  const cs=['#ffd23f','#ff5d5d','#4dd2ff','#ffffff','#ff9a1f','#b28dff'];
  for(let i=0;i<n;i++){
    const a=rr_(0,PI2),v=rr_(40,spread||150);
    G.parts.push({k:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:220,life:rr_(.8,1.5),max:1.5,s:rr_(5,9),c:cs[rnd(cs.length)],r:rr_(0,PI2),vr:rr_(-8,8)});
  }
}
function floatText(x,y,s){G.parts.push({k:'text',x,y,vx:0,vy:-34,g:0,life:1,max:1,s,c:'#ffe066',r:0,vr:0})}

function pick(b,now){
  const s=G.active.findIndex(o=>o&&o.left>0&&!o.locked&&o.t===b.t);
  if(s<0)return false;
  const o=G.active[s],from=pos(b.d),to=BADGE[s];
  G.fx.push({e:TYPES[b.t].e,x0:from.x,y0:from.y,x1:to.x,y1:to.y,t:0,s,col:s===0?['#ff8d7b','#ffc2b3','#ffd9cf']:['#e8ebef','#c5cad2']});
  o.left--;o.flash=now;G.delivered++;
  let px,py;
  do{const a=Math.random()*PI2,r=Math.sqrt(Math.random())*70;px=Math.cos(a)*r;py=Math.sin(a)*r}while(s===0?px>-8:px<8);
  G.pot.push({e:TYPES[b.t].e,slot:s,x:180+px,y:180+py,ph:Math.random()*6,born:now});
  bump('#starhud');
  if(o.left===0){
    S.candy++;save();bump('#candyhud');
    G.pot=G.pot.filter(p=>p.slot!==s);
    confetti(to.x,to.y,26,170);floatText(to.x,to.y-26,'+1');
    G.active[s]=takeOrder(s);
    if(s===0&&G.active[1]&&G.active[1].locked){G.active[1].locked=false;G.active[1].flash=now;confetti(BADGE[1].x,BADGE[1].y,14,110)}
    if(!G.active[0]&&G.active[1]&&G.active[1].locked)G.active[1].locked=false;
  }
  renderStacks();updateHUD();
  return true;
}
function winLevel(){
  if(G.state!=='play')return;
  G.state='win';S.level=G.level+1;S.candy+=3;save();
  updateHUD();
  for(let i=0;i<6;i++)setTimeout(()=>{if(G)confetti(rr_(60,300),rr_(40,200),22,200)},i*130);
  setTimeout(()=>showEnd(true),900);
}
function showEnd(win){
  $('#eT').textContent=win?'Poziom ukończony!':'Taśma zapchana';
  $('#eP').textContent=win?'Rowy są puste. Premia: 3 cukierki.':'Na taśmie nie ma nic, co pasuje do zamówień.';
  const b=$('#eB');b.textContent=win?'Następny poziom':'Spróbuj jeszcze raz';
  b.onclick=()=>newGame(S.level);
  $('#mEnd').classList.add('show');
}

/* ---------- loop ---------- */
function step(dt,now){
  const slow=now<G.slowUntil?0.35:1;
  const sp=BASE*S.mul*slow*dt;
  G.off+=sp;
  /* wejście na taśmę */
  if(G.inbox.length&&G.belt.every(b=>Math.min(b.d,P-b.d)>=GAP)){
    const it=G.inbox.shift();G.belt.push({t:it.t,d:0,born:now});
  }
  for(let i=G.belt.length-1;i>=0;i--){
    const b=G.belt[i],prev=b.d;b.d+=sp;
    if(b.d>=P){b.d-=P;continue}
    for(const pk of PICKS){
      if(prev<pk&&b.d>=pk){if(pick(b,now)){G.belt.splice(i,1)}break}
    }
  }
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i];f.t+=dt/0.35;
    if(f.t>=1){splash(f.x1,f.y1,f.col,9);G.fx.splice(i,1)}
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.r+=p.vr*dt;
  }
  for(let i=G.ripples.length-1;i>=0;i--){G.ripples[i].t+=dt/0.6;if(G.ripples[i].t>=1)G.ripples.splice(i,1)}
  G.steamAcc+=dt;
  if(G.steamAcc>0.14){G.steamAcc=0;G.steam.push({x:180+rr_(-60,60),y:180+rr_(-40,40),r:rr_(9,16),life:2.4,max:2.4,vx:rr_(-8,8)})}
  for(let i=G.steam.length-1;i>=0;i--){const s=G.steam[i];s.life-=dt;if(s.life<=0){G.steam.splice(i,1);continue}s.y-=22*dt;s.x+=s.vx*dt;s.r+=7*dt}
  if(G.state==='play'&&G.flying===0&&G.inbox.length===0){
    if(G.stacks.every(s=>s.length===0)){winLevel()}
    else{
      const ms=matchSet();
      const any=G.belt.some(b=>ms.has(b.t));
      if(!any&&G.belt.length>=G.cap){G.state='lose';setTimeout(()=>showEnd(false),500)}
    }
  }
}

function draw(now){
  const k=cv.width/360;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,360,360);
  function path(){
    ctx.beginPath();
    ctx.moveTo(X0,Y1-R);ctx.lineTo(X0,Y0+R);ctx.arc(X0+R,Y0+R,R,Math.PI,1.5*Math.PI);
    ctx.lineTo(X1-R,Y0);ctx.arc(X1-R,Y0+R,R,1.5*Math.PI,2*Math.PI);
    ctx.lineTo(X1,Y1-R);ctx.arc(X1-R,Y1-R,R,0,0.5*Math.PI);
    ctx.lineTo(X0+R,Y1);ctx.arc(X0+R,Y1-R,R,0.5*Math.PI,Math.PI);
  }
  /* taśma */
  ctx.save();ctx.lineJoin='round';
  path();ctx.lineWidth=52;ctx.strokeStyle='rgba(0,0,0,.32)';ctx.save();ctx.translate(0,5);ctx.stroke();ctx.restore();
  path();ctx.lineWidth=50;ctx.strokeStyle='#8b5733';ctx.stroke();
  path();ctx.lineWidth=48;ctx.strokeStyle='#e9bf96';ctx.stroke();
  path();ctx.lineWidth=40;ctx.strokeStyle='#c28a5c';ctx.stroke();
  path();ctx.lineWidth=34;ctx.strokeStyle='#a46a42';ctx.stroke();
  path();ctx.lineWidth=30;ctx.strokeStyle='#ad7249';ctx.stroke();
  path();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();
  ctx.restore();
  /* szewrony */
  const n=Math.round(P/60),spc=P/n,o=G.off%spc;
  ctx.save();ctx.strokeStyle='rgba(233,191,150,.8)';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<n;i++){
    const p=pos(i*spc+o);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(5,0);ctx.lineTo(-4,8);ctx.stroke();ctx.restore();
  }
  ctx.restore();
  /* punkty zbierania */
  ctx.save();ctx.lineWidth=2.5;ctx.setLineDash([3,4]);ctx.lineDashOffset=-now/60;
  PICKS.forEach(d=>{const p=pos(d);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(p.x,p.y,22,0,PI2);ctx.stroke()});
  ctx.restore();
  /* pomarańczowe wloty */
  [[X0,Y1-R],[X0,112]].forEach(([x,y])=>{
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='rgba(0,0,0,.28)';rr(-30,-26,48,60,13);ctx.fill();
    const g=ctx.createLinearGradient(0,-30,0,30);g.addColorStop(0,'#ffa23a');g.addColorStop(1,'#d96a0c');
    ctx.fillStyle=g;rr(-30,-30,48,60,13);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';rr(-26,-27,40,9,4);ctx.fill();
    ctx.restore();
  });
  drawPot(now);
  /* para */
  G.steam.forEach(s=>{
    const a=Math.sin(Math.PI*(1-s.life/s.max))*0.16;
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,PI2);ctx.fill();
  });
  /* plakietki zamówień */
  G.active.forEach((o,i)=>{if(o)drawBadge(o,BADGE[i].x,BADGE[i].y,now)});
  /* składniki na taśmie */
  G.belt.forEach(b=>{
    const p=pos(b.d);
    const age=Math.min(1,(now-b.born)/260);
    const sc=age<1?(0.35+0.65*(1+2.2*Math.pow(age-1,3)+1.2*Math.pow(age-1,2))):1;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(now/260+b.d/40)*0.12);ctx.scale(sc,sc);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,5,16,13,0,0,PI2);ctx.fill();
    const g=ctx.createRadialGradient(-6,-7,2,0,0,19);g.addColorStop(0,'#ffffff');g.addColorStop(.35,TYPES[b.t].c);g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=TYPES[b.t].c;ctx.beginPath();ctx.arc(0,0,17,0,PI2);ctx.fill();
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,17,0,PI2);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,17,0,PI2);ctx.stroke();
    ctx.font='22px '+FONT_EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(TYPES[b.t].e,0,2);
    ctx.restore();
  });
  /* kółka na wodzie */
  G.ripples.forEach(r=>{ctx.save();ctx.globalAlpha=(1-r.t)*.8;ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.beginPath();ctx.ellipse(r.x,r.y,6+r.t*30,(6+r.t*30)*.7,0,0,PI2);ctx.stroke();ctx.restore()});
  /* lecące do garnka */
  G.fx.forEach(f=>{
    const t=Math.min(1,f.t),e=t*t*(3-2*t);
    const x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-34*Math.sin(Math.PI*t);
    ctx.save();ctx.translate(x,y);ctx.rotate(t*5);
    ctx.font=Math.round(26*(1-0.4*t))+'px '+FONT_EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.e,0,0);ctx.restore();
  });
  /* cząsteczki */
  G.parts.forEach(p=>{
    const a=Math.max(0,p.life/p.max);ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);
    if(p.k==='text'){ctx.font='26px '+FONT_TXT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#7a3a10';ctx.strokeText(p.s,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.s,p.x,p.y)}
    else if(p.k==='conf'){ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+.6*a),0,PI2);ctx.fill()}
    ctx.restore();
  });
}

function anise(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  for(let i=0;i<8;i++){
    ctx.rotate(PI2/8);
    ctx.fillStyle='#6b3a1a';ctx.beginPath();ctx.ellipse(r*.55,0,r*.5,r*.2,0,0,PI2);ctx.fill();
    ctx.fillStyle='#8a5326';ctx.beginPath();ctx.ellipse(r*.58,0,r*.28,r*.09,0,0,PI2);ctx.fill();
  }
  ctx.fillStyle='#4a2610';ctx.beginPath();ctx.arc(0,0,r*.25,0,PI2);ctx.fill();
  ctx.restore();
}

function drawPot(now){
  const cx=180,cy=180;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,10,113,108,0,0,PI2);ctx.fill();
  /* uchwyty z rybkami */
  [[-0.62],[2.52]].forEach(([a])=>{
    ctx.save();ctx.rotate(a);ctx.translate(102,0);
    ctx.fillStyle='#d8cbb6';rr(-6,-16,36,36,11);ctx.fill();
    ctx.fillStyle='#fff8ea';rr(-6,-19,36,36,11);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#cdbda3';ctx.stroke();
    ctx.restore();
    ctx.font='20px '+FONT_EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🐟',Math.cos(a)*(102+12),Math.sin(a)*(102+12)-2);
  });
  /* korpus */
  const og=ctx.createLinearGradient(0,-110,0,118);og.addColorStop(0,'#ffa174');og.addColorStop(1,'#d24f2a');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(0,5,111,0,PI2);ctx.fill();
  const rg=ctx.createRadialGradient(-20,-30,40,0,0,108);rg.addColorStop(0,'#fffcf6');rg.addColorStop(1,'#e0d3bf');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,107,0,PI2);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#c9b9a0';ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.arc(0,0,99,0,PI2);ctx.stroke();
  ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(0,0,103,Math.PI*1.08,Math.PI*1.45);ctx.stroke();
  /* wnętrze */
  ctx.save();
  ctx.beginPath();ctx.arc(0,0,94,0,PI2);ctx.clip();
  const gg=ctx.createRadialGradient(40,-30,10,0,0,110);gg.addColorStop(0,'#a9aeb7');gg.addColorStop(1,'#767b85');
  ctx.fillStyle=gg;ctx.fillRect(-100,-100,200,200);
  const rg2=ctx.createRadialGradient(-35,-20,6,-20,0,115);rg2.addColorStop(0,'#f26257');rg2.addColorStop(1,'#bd3632');
  ctx.fillStyle=rg2;
  ctx.beginPath();ctx.arc(0,0,94,Math.PI/2,1.5*Math.PI);ctx.fill();
  ctx.beginPath();ctx.arc(0,-47,47,0,PI2);ctx.fill();
  ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,47,47,0,PI2);ctx.fill();
  /* fale na wywarze */
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,205,185,.22)';
  for(let j=0;j<6;j++){
    ctx.beginPath();
    for(let x=-90;x<=0;x+=6){const y=-70+j*26+Math.sin(x/14+now/420+j)*3;x===-90?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,.1)';
  for(let j=0;j<5;j++){
    ctx.beginPath();
    for(let x=0;x<=90;x+=6){const y=-60+j*28+Math.sin(x/14-now/520+j)*2.5;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  }
  /* bąbelki */
  for(let i=0;i<10;i++){
    const bx=-78+((i*37)%72),by=72-((now/26+i*43)%150);
    ctx.fillStyle='rgba(255,185,165,.4)';ctx.beginPath();ctx.arc(bx,by,3+(i%3),0,PI2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(bx-1,by-1,1,0,PI2);ctx.fill();
  }
  /* przyprawy */
  anise(-58+Math.sin(now/900)*3,-30+Math.cos(now/800)*2,15,now/2400);
  anise(-20+Math.cos(now/1000)*3,-64+Math.sin(now/760)*2,11,-now/2000);
  ctx.font='22px '+FONT_EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.translate(-76+Math.sin(now/700)*2,-4+Math.cos(now/650)*2);ctx.rotate(Math.sin(now/900)*.3);ctx.fillText('🌿',0,0);ctx.restore();
  /* przegroda */
  ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.arc(2,-45,47,-Math.PI/2,Math.PI/2,false);ctx.arc(2,49,47,-Math.PI/2,Math.PI/2,true);ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle='#fbf4e6';
  ctx.beginPath();ctx.arc(0,-47,47,-Math.PI/2,Math.PI/2,false);ctx.arc(0,47,47,-Math.PI/2,Math.PI/2,true);ctx.stroke();
  /* zawartość */
  ctx.font='18px '+FONT_EMOJI;
  G.pot.forEach(p=>{
    const age=Math.min(1,(now-p.born)/300);
    ctx.save();ctx.translate(p.x-cx,p.y-cy+Math.sin(now/500+p.ph)*2.2);ctx.rotate(Math.sin(now/700+p.ph)*.25);
    ctx.scale(age,age);ctx.fillText(p.e,0,0);ctx.restore();
  });
  ctx.restore();
  ctx.restore();
}
function drawBadge(o,x,y,now){
  const pulse=1+0.3*Math.max(0,1-(now-o.flash)/380);
  ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(0,0,0,.28)';rr(-37,-19,74,46,14);ctx.fill();
  const g=ctx.createLinearGradient(0,-23,0,23);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#f3e2bf');
  ctx.fillStyle=g;rr(-37,-23,74,46,14);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#d6bd8f';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';rr(-31,-20,62,6,3);ctx.fill();
  ctx.font='26px '+FONT_EMOJI;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(TYPES[o.t].e,-17,1);
  ctx.font='26px '+FONT_TXT;
  ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#8a5a2b';ctx.strokeText('x'+o.left,17,2);
  ctx.fillStyle='#fff';ctx.fillText('x'+o.left,17,2);
  if(o.locked){
    ctx.fillStyle='rgba(55,58,70,.62)';rr(-37,-23,74,46,14);ctx.fill();
    ctx.lineWidth=5;ctx.setLineDash([7,4]);ctx.strokeStyle='#b6bcc7';
    ctx.beginPath();ctx.moveTo(-34,-14);ctx.lineTo(34,14);ctx.moveTo(-34,14);ctx.lineTo(34,-14);ctx.stroke();ctx.setLineDash([]);
    ctx.font='24px '+FONT_EMOJI;ctx.fillText('🔒',0,0);
  }
  ctx.restore();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G){if(G.state==='play'||G.state==='win')step(dt,now);updateBelt();draw(now)}
  requestAnimationFrame(frame);
}

/* ---------- sterowanie: dotknięcie lub przytrzymanie rowu ---------- */
let hold=null;
function stopHold(){if(hold){clearInterval(hold);hold=null}}
function nearestCol(x){
  let best=-1,bd=1e9;
  cols.forEach((c,i)=>{const r=c.getBoundingClientRect();const d=x<r.left?r.left-x:x>r.right?x-r.right:0;const m=Math.abs(x-(r.left+r.right)/2);const sc=d*1000+m;if(sc<bd){bd=sc;best=i}});
  return best;
}
stacksEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const i=nearestCol(e.clientX);if(i<0)return;
  stopHold();
  tapStack(i);
  const iv=Math.round(1000*GAP/(BASE*S.mul))+10;
  hold=setInterval(()=>tapStack(i,true),iv);
});
window.addEventListener('pointerup',stopHold);
window.addEventListener('pointercancel',stopHold);
window.addEventListener('blur',stopHold);

/* ---------- UI ---------- */
$('#spd').addEventListener('click',()=>{S.mul=S.mul%3+1;save();$('#spdt').textContent='x'+S.mul;toast('Prędkość taśmy: x'+S.mul,900)});
$('#gear').addEventListener('click',()=>{$('#mLvl').value=G.level;$('#mMenu').classList.add('show')});
$('#mClose').addEventListener('click',()=>$('#mMenu').classList.remove('show'));
$('#mRestart').addEventListener('click',()=>newGame(G.level));
$('#mGo').addEventListener('click',()=>{const v=Math.max(1,Math.min(9999,parseInt($('#mLvl').value,10)||1));S.level=v;save();newGame(v)});
$('#mReset').addEventListener('click',()=>{S=S0();save();newGame(1)});

resize();
new ResizeObserver(resize).observe(cv);
let restored=false;
try{if(S.game&&S.game.level===S.level&&S.game.stacks&&S.game.active){restoreGame(S.game);restored=true}}catch(e){restored=false}
if(!restored)newGame(S.level);
setInterval(save,2000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);
requestAnimationFrame(frame);
})();
</script>
